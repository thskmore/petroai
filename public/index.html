function supForm(id){var c=id?sfind(id):{name:"",kind:"Oil company",phone:""};
openM('<h2>'+(id?'Edit supplier':'Add supplier')+'</h2><label>Name<input id="f1" value="'+esc(c.name)+'"></label><label>Type<select id="f2"><option'+(c.kind=="Oil company"?" selected":"")+'>Oil company</option><option'+(c.kind=="Dealer"?" selected":"")+'>Dealer</option></select></label><label>Phone (optional)<input id="f3" inputmode="tel" value="'+esc(c.phone)+'"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveSup('+(id||0)+')">Save supplier</button></div>')}
function saveSup(id){if(!v("f1"))return er("Enter the supplier name.");var o={name:v("f1"),kind:v("f2"),phone:v("f3")};if(id)Object.assign(sfind(id),o);else{o.id=Date.now();o.e=[];S.sup.push(o)}save();close();renderSup()}
function supEntry(t){var s=sfind(sv),b=t=="bill";
openM('<h2>'+(b?'Add purchase bill':'Record payment')+'</h2><div class="sub">'+esc(s.name)+'</div><label>Date<input id="f1" type="date" value="'+today()+'"></label><label>'+(b?'Bill details<input id="f2" placeholder="e.g. HSD tanker, bill no. 1042">':'Mode<select id="f2"><option>Bank transfer</option><option>Cash</option><option>UPI</option><option>Cheque</option></select>')+'</label><label>Amount (\u20b9)<input id="f3" inputmode="decimal"></label>'+(b?'<label>Add to stock (optional)<select id="f4"><option value="">Not a stock item</option>'+S.items.map(function(i){return '<option value="'+i.id+'">'+esc(i.name)+'</option>'}).join("")+'</select></label><label>Quantity received<input id="f5" inputmode="decimal"></label>':'')+'<div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveSE(\''+t+'\')">Save</button></div>')}
function saveSE(t){var s=sfind(sv),a=parseFloat(v("f3")),o={d:v("f1"),t:t,n:v("f2"),a:a};
if(!(a>0))return er("Enter an amount above zero.");if(!o.n)return er("Enter the bill details.");
if(t=="bill"&&v("f4")){var q=parseFloat(v("f5"));if(!(q>0))return er("Enter the quantity received.");var i=itm(v("f4"));i.stock=Math.round((i.stock+q)*1000)/1000;o.it=i.id;o.q=q}
s.e.push(o);save();close();renderSup()}
function delSup(i){var s=sfind(sv),x=s.e[i];ask("Delete this "+(x.t=="pay"?"payment":"bill")+" of "+inr(x.a)+"?"+(x.it?" The stock it added will be removed too.":""),function(){if(x.it){var u=itm(x.it);if(u)u.stock=Math.max(0,Math.round((u.stock-x.q)*1000)/1000)}s.e.splice(i,1);save();renderSup()})}
var ACC=["Cash","Bank","UPI"],ACN={Cash:"Cash",Bank:"Bank",UPI:"UPI / wallet"};
function accOf(m){return m=="Cash"?"Cash":m=="UPI"?"UPI":"Bank"}
function bkRows(){var r=[];
S.c.forEach(function(c){c.e.forEach(function(x){if(x.t=="pay")r.push({d:x.d,a:accOf(x.n),m:x.a,n:"Received from "+c.name})})});
S.inv.forEach(function(i){if(i.mode!="credit")r.push({d:i.d,a:accOf(i.mode),m:i.total,n:"Invoice "+i.no+" ("+i.name+")"})});
S.sup.forEach(function(s){s.e.forEach(function(x){if(x.t=="pay")r.push({d:x.d,a:accOf(x.n),m:-x.a,n:"Paid to "+s.name})})});
S.bk.forEach(function(b){if(b.t=="xfer"){r.push({d:b.d,a:b.acct,m:-b.a,n:"Transfer to "+ACN[b.to],id:b.id});r.push({d:b.d,a:b.to,m:b.a,n:"Transfer from "+ACN[b.acct],id:b.id})}else r.push({d:b.d,a:b.acct,m:b.t=="in"?b.a:-b.a,n:(b.cat?b.cat+": ":"")+b.n,id:b.id})});
return r.sort(function(p,q){return p.d<q.d?1:-1})}
function renderBook(){var R=bkRows(),h=nav(),tot=0,B={};
ACC.forEach(function(a){B[a]=(S.ob[a]||0)+R.filter(function(x){return x.a==a}).reduce(function(s,x){return s+x.m},0);tot+=B[a]});
h+='<h1>Money in hand, all accounts</h1><div class="total" style="color:var(--ink)">'+inr(tot)+'</div><div class="row" style="gap:6px">'+ACC.map(function(a){return '<div class="cust" style="margin:0;padding:8px;cursor:default;text-align:center"><div class="sub">'+ACN[a]+'</div><b style="color:'+(B[a]<0?'var(--due)':'var(--ink)')+'">'+inr(B[a])+'</b></div>'}).join("")+'</div><div class="btns"><button onclick="bkForm(\'out\')">Add expense</button><button onclick="bkForm(\'in\')">Add income</button><button class="ghost" onclick="bkForm(\'xfer\')">Transfer</button><button class="ghost" onclick="obForm()">Opening balances</button></div><div class="row" style="gap:6px;margin-bottom:10px">'+["all"].concat(ACC).map(function(a){return '<button style="padding:8px 4px;font-size:14px" class="'+(bf==a?'':'ghost')+'" onclick="bf=\''+a+'\';renderBook()">'+(a=="all"?"All":ACN[a])+'</button>'}).join("")+'</div><div class="tbl"><table><tr><th>Date</th><th>Detail</th><th>Account</th><th class="r">Amount</th><th></th></tr>';
var L=R.filter(function(x){return bf=="all"||x.a==bf});
L.forEach(function(x){h+='<tr><td>'+x.d.slice(5)+'</td><td>'+esc(x.n)+'</td><td>'+ACN[x.a]+'</td><td class="r '+(x.m>=0?'pay':'sale')+'">'+(x.m>=0?'+':'\u2212')+inr(Math.abs(x.m))+'</td><td>'+(x.id?'<button class="ghost" style="padding:5px 8px" onclick="delBk('+x.id+')">Delete</button>':'')+'</td></tr>'});
if(!L.length)h+='<tr><td colspan="5" class="empty">No money movements yet.</td></tr>';
h+='</table></div><div class="sub" style="margin-top:8px">Customer payments, cash and UPI invoices, and supplier payments appear here automatically. Add expenses, income and transfers yourself.</div>';
document.getElementById("app").innerHTML=h}
function accSel(id,sel){return '<select id="'+id+'">'+ACC.map(function(a){return '<option value="'+a+'"'+(a==sel?' selected':'')+'>'+ACN[a]+'</option>'}).join("")+'</select>'}
function bkForm(t){var x=t=="xfer";openM('<h2>'+(t=="out"?'Add expense':t=="in"?'Add income':'Transfer between accounts')+'</h2><label>Date<input id="f1" type="date" value="'+today()+'"></label><label>'+(x?'From':'Account')+accSel("f2","Cash")+'</label>'+(x?'<label>To'+accSel("f3","Bank")+'</label>':(t=="out"?CATSEL:'')+'<label>Details<input id="f4" placeholder="'+(t=="out"?"e.g. Electricity bill":"e.g. Other income")+'"></label>')+'<label>Amount (\u20b9)<input id="f5" inputmode="decimal"></label><div class="err" id="er"></div><div class="row"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveBk(\''+t+'\')">Save</button></div>')}
function saveBk(t){var a=parseFloat(v("f5")),o={id:Date.now(),d:v("f1"),t:t,acct:v("f2"),a:a};
if(!(a>0))return er("Enter an amount above zero.");
if(t=="xfer"){o.to=v("f3");if(o.to==o.acct)return er("Choose two different accounts.")}else{o.n=v("f4");if(!o.n)return er("Enter the details.")}
if(t=="out")o.cat=v("f6");S.bk.push(o);save();close();renderBook()}
function delBk(id){ask("Delete this entry?",function(){S.bk=S.bk.filter(function(b){return b.id!=id});save();renderBook()})}
function obForm(){openM('<h2>Opening balances</h2><div class="sub">What each account held before you started using this book</div>'+ACC.map(function(a,i){return '<label>'+ACN[a]+' (\u20b9)<input id="o'+i+'" inputmode="decimal" value="'+(S.ob[a]||0)+'"></label>'}).join("")+'<div class="err" id="er"></div><div class="row" style="margin-top:14px"><button class="ghost" onclick="close()">Cancel</button><button onclick="saveOb()">Save balances</button></div>')}
function saveOb(){var o={};for(var i=0;i<3;i++){var n=parseFloat(v("o"+i));if(isNaN(n))return er("Enter a number for every account (0 if empty).");o[ACC[i]]=n}S.ob=o;save();close();renderBook()}
var CAT=["Salary","Electricity","Rent","Repairs","Transport","Other"],CATSEL='<label>Category<select id="f6">'+CAT.map(function(c){return '<option>'+c+'</option>'}).join("")+'</select></label>';
function inR(d){return d>=rf&&d<=rt}
function getRepData(){
  var sales=0,cg=0,ig=0,n=0;
  S.inv.forEach(function(i){if(!inR(i.d))return;n++;sales+=i.t;if(i.ig)ig+=i.x;else cg+=i.x/2});
  var buy={"Oil company":0,"Dealer":0};
  S.sup.forEach(function(s){s.e.forEach(function(x){if(x.t=="bill"&&inR(x.d))buy[s.kind]=(buy[s.kind]||0)+x.a})});
  var ex={},exT=0,inc=0;
  S.bk.forEach(function(b){if(!inR(b.d))return;if(b.t=="out"){var k=b.cat||"Other";ex[k]=(ex[k]||0)+b.a;exT+=b.a}else if(b.t=="in")inc+=b.a});
  var net=sales+inc-buy["Oil company"]-buy.Dealer-exT;
  var expList=Object.keys(ex).sort(function(a,b){return ex[b]-ex[a]}).map(function(k){return {category:k,amount:ex[k]}});
  var cs=S.c.filter(function(c){return due(c)>0}).sort(function(a,b){return due(b)-due(a)});
  var ct=cs.reduce(function(s,c){return s+due(c)},0);
  var cv=0,rv=0;
  var items=(S.items||[]).map(function(i){
    var costVal=i.stock*i.buy,sellVal=i.stock*i.sell;
    cv+=costVal;rv+=sellVal;
    return {name:i.name,stock:i.stock,unit:i.unit,buy:i.buy,sell:i.sell,costVal:costVal,sellVal:sellVal,isLow:i.stock<=i.low};
  });
  return {rf:rf,rt:rt,sales:sales,cg:cg,ig:ig,n:n,buy:buy,ex:ex,exT:exT,inc:inc,net:net,expList:expList,customers:cs,totalDue:ct,items:items,costVal:cv,sellVal:rv};
}
function exportRepCSV(){
  var D=getRepData(),q=function(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'};
  var lines=[];
  var bizName=(S.biz&&S.biz.name)||"Petrol Pump Management";
  lines.push([q("FINANCIAL REPORT"),q(bizName)].join(","));
  if(S.biz&&S.biz.gst)lines.push([q("GSTIN"),q(S.biz.gst)].join(","));
  if(S.biz&&S.biz.addr)lines.push([q("Address"),q(S.biz.addr)].join(","));
  lines.push([q("Report Period"),q(D.rf+" to "+D.rt)].join(","));
  lines.push([q("Exported On"),q(new Date().toLocaleString("en-IN"))].join(","));
  lines.push("");
  lines.push(q("1. PROFIT AND LOSS STATEMENT"));
  lines.push([q("Item"),q("Amount (INR)")].join(","));
  lines.push([q("Sales (invoices, before GST)"),D.sales.toFixed(2)].join(","));
  lines.push([q("Other income"),D.inc.toFixed(2)].join(","));
  lines.push([q("Purchases: Oil company"),D.buy["Oil company"].toFixed(2)].join(","));
  lines.push([q("Purchases: Dealers"),D.buy.Dealer.toFixed(2)].join(","));
  lines.push([q("Operating expenses"),D.exT.toFixed(2)].join(","));
  lines.push([q("Net Profit / Loss"),D.net.toFixed(2)].join(","));
  lines.push("");
  lines.push(q("2. GST COLLECTED SUMMARY"));
  lines.push([q("Metric"),q("Value")].join(","));
  lines.push([q("Total Invoices Count"),D.n].join(","));
  lines.push([q("Taxable Value"),D.sales.toFixed(2)].join(","));
  lines.push([q("CGST 9%"),D.cg.toFixed(2)].join(","));
  lines.push([q("SGST 9%"),D.cg.toFixed(2)].join(","));
  lines.push([q("IGST 18%"),D.ig.toFixed(2)].join(","));
  lines.push([q("Total GST Tax"), (D.cg*2+D.ig).toFixed(2)].join(","));
  lines.push("");
  lines.push(q("3. EXPENSES BY CATEGORY"));
  lines.push([q("Category"),q("Amount (INR)")].join(","));
  if(D.expList.length){
    D.expList.forEach(function(x){lines.push([q(x.category),x.amount.toFixed(2)].join(","))});
    lines.push([q("Total Expenses"),D.exT.toFixed(2)].join(","));
  }else{lines.push([q("No expenses in this period"),"0.00"].join(","))}
  lines.push("");
  lines.push(q("4. CUSTOMER OUTSTANDING DUES (As of today)"));
  lines.push([q("Customer Name"),q("Phone"),q("Credit Limit (INR)"),q("Due Amount (INR)"),q("Status")].join(","));
  if(D.customers.length){
    D.customers.forEach(function(c){
      var d=due(c);
      lines.push([q(c.name),q(c.phone||""),(c.limit||0).toFixed(2),d.toFixed(2),q(d>c.limit?"OVER LIMIT":"Normal")].join(","));
    });
    lines.push([q("Total Customer Outstanding"),"","",D.totalDue.toFixed(2),""].join(","));
  }else{lines.push([q("No outstanding dues"),"","","0.00","All clear"].join(","))}
  lines.push("");
  lines.push(q("5. STOCK VALUATION (As of today)"));
  lines.push([q("Item Name"),q("Current Stock"),q("Unit"),q("Cost Price (INR)"),q("Sale Price (INR)"),q("Valuation At Cost (INR)"),q("Valuation At Selling (INR)"),q("Stock Status")].join(","));
  if(D.items.length){
    D.items.forEach(function(i){
      lines.push([q(i.name),i.stock,q(i.unit||""),i.buy.toFixed(2),i.sell.toFixed(2),i.costVal.toFixed(2),i.sellVal.toFixed(2),q(i.isLow?"LOW STOCK":"OK")].join(","));
    });
    lines.push([q("Total Stock Valuation"),"","","","",D.costVal.toFixed(2),D.sellVal.toFixed(2),""].join(","));
  }else{lines.push([q("No inventory items found"),"","","","","0.00","0.00",""].join(","))}
  var blob=new Blob(["\uFEFF"+lines.join("\r\n")],{type:"text/csv;charset=utf-8;"});
  var url=URL.createObjectURL(blob),a=document.createElement("a");
  a.href=url;
  a.download="Financial-Report-"+D.rf+"-to-"+D.rt+".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  toast("Financial report exported to Excel / CSV successfully.");
}

function getDailyUsagePatterns(dailyData){
  if(!dailyData||!dailyData.length)return null;
  var last30=dailyData.slice(-30);
  if(!last30.length)return null;

  var maxDay=last30[0], minDay=last30[0];
  var totalVol=0, weekdayVol=0, weekdayCount=0, weekendVol=0, weekendCount=0;
  var dayNames=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
  var dayTotals={Sun:0,Mon:0,Tue:0,Wed:0,Thu:0,Fri:0,Sat:0};
  var dayCounts={Sun:0,Mon:0,Tue:0,Wed:0,Thu:0,Fri:0,Sat:0};

  last30.forEach(function(d){
    var v=Number(d.litres)||0;
    totalVol+=v;
    if(v>(maxDay.litres||0))maxDay=d;
    if(v<(minDay.litres||Infinity))minDay=d;

    var parts=(d.date||'').split('-');
    var dt=parts.length===3?new Date(parts[0],parts[1]-1,parts[2]):new Date(d.date);
    var dow=dayNames[dt.getDay()];
    dayTotals[dow]=(dayTotals[dow]||0)+v;
    dayCounts[dow]=(dayCounts[dow]||0)+1;

    if(dt.getDay()===0||dt.getDay()===6){
      weekendVol+=v;
      weekendCount++;
    }else{
      weekdayVol+=v;
      weekdayCount++;
    }
  });

  var avgWeekday=weekdayCount?Math.round(weekdayVol/weekdayCount):0;
  var avgWeekend=weekendCount?Math.round(weekendVol/weekendCount):0;
  var peakDayName="";
  var highestDayAvg=0;
  dayNames.forEach(function(dn){
    var avg=dayCounts[dn]?dayTotals[dn]/dayCounts[dn]:0;
    if(avg>highestDayAvg){highestDayAvg=avg;peakDayName=dn}
  });

  return {
    count: last30.length,
    maxDay: maxDay,
    minDay: minDay,
    avgDaily: Math.round(totalVol/last30.length),
    avgWeekday: avgWeekday,
    avgWeekend: avgWeekend,
    peakDayOfWeek: peakDayName || "N/A"
  };
}

      var parts=m.month.split("-");

      h+='<tr><td><b>'+mLabel+'</b></td><td class="r">'+lt(m.litres)+'</td><td class="r">'+inr(m.revenue)+'</td><td class="r" style="color:var(--due)">'+inr(m.expenses)+'</td><td class="r">'+m.dutiesCount+'</td></tr>';
    });

  }

  h+='<div style="display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:8px;margin-bottom:8px">';
  h+='<div><h2 style="font-size:15px;margin:0 0 2px">Expense distributions</h2><div class="sub">Categorized shift & cash book expenses ('+inr(sum.totalExpenses)+' total)</div></div>';
  h+='<div class="noprint" style="display:flex;gap:4px">';
  h+='<button style="padding:4px 8px;font-size:11px" class="'+(AN_EXP_VIEW==='donut'?'':'ghost')+'" onclick="setAnExpView(\'donut\')">Donut</button>';
  h+='<button style="padding:4px 8px;font-size:11px" class="'+(AN_EXP_VIEW==='bars'?'':'ghost')+'" onclick="setAnExpView(\'bars\')">Ranked</button>';
  h+='</div></div>';

  if(AN_EXP_VIEW==='donut'){
    h+='<div id="d3-expense-donut" style="display:flex;justify-content:center;align-items:center;min-height:240px;position:relative"></div>';
  }else{
    h+='<div id="d3-expense-bars" style="width:100%;min-height:180px;position:relative"></div>';
  }

  if(exps.length){
    var catColors=["#ef4444","#f59e0b","#3b82f6","#10b981","#8b5cf6","#ec4899","#6366f1","#14b8a6","#64748b"];
    h+='<div class="tbl" style="margin-top:10px"><table><tr><th>Category</th><th>Source</th><th class="r">Entries</th><th class="r">Amount</th><th class="r">Share</th></tr>';
    exps.forEach(function(e,i){
      var cColor=catColors[i%catColors.length];
      var srcLabel=e.source==='shift'?'Shift duties':(e.source==='book'?'Cash book':'Duty & Book');
      h+='<tr><td><span class="an-chip" style="border:0;padding:0"><i style="background:'+cColor+'"></i> '+esc(e.category)+'</span></td><td class="sub">'+srcLabel+'</td><td class="r">'+e.count+'</td><td class="r"><b>'+inr(e.amount)+'</b></td><td class="r">'+e.percentage+'%</td></tr>';
    });
    h+='<tr><td colspan="3"><b>Total</b></td><td class="r"><b style="color:var(--due)">'+inr(sum.totalExpenses)+'</b></td><td class="r"><b>100%</b></td></tr>';
    h+='</table></div>';
  }
  h+='</div>';

  // Section 4: Fuel Product Breakdown Cards
  if(fuels.length){
    h+='<h2 style="margin:20px 0 6px;color:var(--ink);font-size:16px;font-weight:800">Fuel product breakdown</h2>';
    h+='<div style="flex-direction:column;display:flex;gap:8px">';
    fuels.forEach(function(f){
      var fuelColor=f.fuel.indexOf("Diesel")>-1?"#2563eb":(f.fuel.indexOf("Power")>-1?"#d97706":"#059669");
      h+='<div class="cust" style="cursor:default;margin:0">';
      h+='<div class="row"><b><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+fuelColor+';margin-right:6px"></span>'+esc(f.fuel)+'</b><span class="amt" style="flex:none">'+inr(f.revenue)+'</span></div>';
      h+='<div class="sub">Volume: <b>'+lt(f.litres)+'</b> ('+f.litresPct+'% of total fuel volume)</div>';
      h+='<div class="bar"><i style="width:'+f.litresPct+'%;background:'+fuelColor+'"></i></div>';
      h+='</div>';
    });
    h+='</div>';
  }

  document.getElementById("app").innerHTML=h;
  setTimeout(renderAnCharts,20);
}

function renderAnCharts(){
  if(!AN_DATA)return;
  var daily=AN_DATA.daily||[];
  var monthly=AN_DATA.monthly||[];
  var exps=AN_DATA.expenseBreakdown||[];

  var rcEl=document.getElementById("recharts-daily-chart");
  if(rcEl&&typeof window.renderRechartsDailySales==="function"){
    window.renderRechartsDailySales(rcEl, daily, AN_METRIC, AN_FUEL_VIEW);
  } else if(typeof d3!=="undefined"){
    var d3El=document.getElementById("d3-daily-chart");
    if(d3El){ d3El.style.display="block"; renderD3DailyChart(daily, AN_METRIC, AN_FUEL_VIEW); }
  }

  var compEl=document.getElementById("recharts-fuel-comparison");
  if(compEl&&typeof window.renderRechartsFuelComparison==="function"){
    window.renderRechartsFuelComparison(compEl, daily, { metric: AN_METRIC });
  }

  if(typeof d3!=="undefined"){
    renderD3MonthlyChart(monthly, AN_METRIC);
    if(AN_EXP_VIEW==='donut'){renderD3ExpenseDonut(exps)}else{renderD3ExpenseBars(exps)}
  }
}

function renderD3DailyChart(dailyData,metric,viewMode){
  var container=document.getElementById("d3-daily-chart");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!dailyData||!dailyData.length){
    container.innerHTML='<div class="empty">No daily fuel sales in this period.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.max(300,rect.width||520);
  var height=230;
  var margin={top:20,right:16,bottom:32,left:metric==="rev"?58:50};

  var parseTime=d3.timeParse("%Y-%m-%d");
  var formatted=dailyData.map(function(d){
    var obj={date:parseTime(d.date)||new Date(d.date),rawDate:d.date,byFuel:d.byFuel||{}};
    obj.val=metric==="vol"?(d.litres||0):(d.revenue||0);
    return obj;
  });

  var svg=d3.select(container).append("svg")
    .attr("viewBox","0 0 "+width+" "+height)
    .attr("width","100%").attr("height",height).style("overflow","visible");

  var tooltip=d3.select(container).append("div").attr("class","chart-tooltip");

  var x=d3.scaleTime().domain(d3.extent(formatted,function(d){return d.date})).range([margin.left,width-margin.right]);

  var fuelTypes=["Diesel (HSD)","Petrol (MS)","Power petrol"];
  var fuelColors={"Diesel (HSD)":"#2563eb","Petrol (MS)":"#059669","Power petrol":"#d97706","Other":"#7c3aed"};

  var yMax=0;
  if(viewMode==="byfuel"){
    formatted.forEach(function(d){
      fuelTypes.forEach(function(f){
        var fv=d.byFuel[f]?(metric==="vol"?d.byFuel[f].litres:d.byFuel[f].revenue):0;
        if(fv>yMax)yMax=fv;
      });
    });
  }else{
    yMax=d3.max(formatted,function(d){return d.val})||100;
  }
  if(yMax<=0)yMax=100;

  var y=d3.scaleLinear().domain([0,yMax*1.15]).range([height-margin.bottom,margin.top]);

  svg.append("g").attr("class","grid").attr("transform","translate("+margin.left+",0)")
    .call(d3.axisLeft(y).ticks(4).tickSize(-(width-margin.left-margin.right)).tickFormat(""))
    .call(function(g){g.select(".domain").remove();g.selectAll("line").attr("stroke","var(--line)").attr("stroke-opacity",0.5).attr("stroke-dasharray","3,3")});

  var xAxis=d3.axisBottom(x).ticks(Math.min(formatted.length,Math.floor(width/75))).tickFormat(d3.timeFormat("%d %b"));
  svg.append("g").attr("transform","translate(0,"+(height-margin.bottom)+")").call(xAxis)
    .call(function(g){g.select(".domain").attr("stroke","var(--line)");g.selectAll("text").attr("fill","var(--mute)").style("font-size","11px");g.selectAll("line").attr("stroke","var(--line)")});

  var yAxis=d3.axisLeft(y).ticks(4).tickFormat(function(d){
    if(metric==="rev"){
      if(d>=100000)return "₹"+(d/100000).toFixed(1)+"L";
      if(d>=1000)return "₹"+(d/1000).toFixed(0)+"k";
      return "₹"+d;
    }else{
      if(d>=1000)return (d/1000).toFixed(1)+"k L";
      return d+" L";
    }
  });
  svg.append("g").attr("transform","translate("+margin.left+",0)").call(yAxis)
    .call(function(g){g.select(".domain").remove();g.selectAll("text").attr("fill","var(--mute)").style("font-size","11px");g.selectAll("line").remove()});

  var defs=svg.append("defs");
  var grad=defs.append("linearGradient").attr("id","daily-grad").attr("x1","0%").attr("y1","0%").attr("x2","0%").attr("y2","100%");
  grad.append("stop").attr("offset","0%").attr("stop-color","#0b7a5f").attr("stop-opacity",0.35);
  grad.append("stop").attr("offset","100%").attr("stop-color","#0b7a5f").attr("stop-opacity",0.0);

  if(viewMode==="total"){
    var area=d3.area().x(function(d){return x(d.date)}).y0(y(0)).y1(function(d){return y(d.val)}).curve(d3.curveMonotoneX);
    svg.append("path").datum(formatted).attr("fill","url(#daily-grad)").attr("d",area);

    var line=d3.line().x(function(d){return x(d.date)}).y(function(d){return y(d.val)}).curve(d3.curveMonotoneX);
    svg.append("path").datum(formatted).attr("fill","none").attr("stroke","#0b7a5f").attr("stroke-width",2.5).attr("d",line);

    svg.selectAll(".dot").data(formatted).enter().append("circle")
      .attr("cx",function(d){return x(d.date)}).attr("cy",function(d){return y(d.val)})
      .attr("r",formatted.length>25?2.5:3.5).attr("fill","#fff").attr("stroke","#0b7a5f").attr("stroke-width",2);
  }else{
    fuelTypes.forEach(function(fName){
      var fColor=fuelColors[fName]||"#888";
      var fLine=d3.line().x(function(d){return x(d.date)}).y(function(d){
        var val=d.byFuel[fName]?(metric==="vol"?d.byFuel[fName].litres:d.byFuel[fName].revenue):0;
        return y(val);
      }).curve(d3.curveMonotoneX);
      svg.append("path").datum(formatted).attr("fill","none").attr("stroke",fColor).attr("stroke-width",2.2).attr("d",fLine);
      svg.selectAll(".dot-"+fName.replace(/\W/g,"")).data(formatted).enter().append("circle")
        .attr("cx",function(d){return x(d.date)}).attr("cy",function(d){
          var val=d.byFuel[fName]?(metric==="vol"?d.byFuel[fName].litres:d.byFuel[fName].revenue):0;
          return y(val);
        }).attr("r",2.5).attr("fill","#fff").attr("stroke",fColor).attr("stroke-width",1.5);
    });
  }

  var focusLine=svg.append("line").attr("stroke","var(--ink)").attr("stroke-opacity",0.4).attr("stroke-dasharray","3,3")
    .attr("y1",margin.top).attr("y2",height-margin.bottom).style("display","none");

  var bisectDate=d3.bisector(function(d){return d.date}).left;

  svg.append("rect")
    .attr("width",width-margin.left-margin.right).attr("height",height-margin.top-margin.bottom)
    .attr("transform","translate("+margin.left+","+margin.top+")").attr("fill","transparent")
    .style("cursor","crosshair")
    .on("mousemove",function(event){
      var coords=d3.pointer(event,this);
      var x0=x.invert(coords[0]+margin.left);
      var i=bisectDate(formatted,x0,1);
      var d0=formatted[i-1],d1=formatted[i],d=d0;
      if(d1&&(x0-d0.date>d1.date-x0))d=d1;
      if(!d)return;
      var cx=x(d.date);
      focusLine.attr("x1",cx).attr("x2",cx).style("display",null);
      var th='<b style="color:var(--ink)">'+d.rawDate+'</b><br/>';
      th+=(metric==="vol"?"Volume: <b>"+lt(d.val)+"</b>":"Revenue: <b>"+inr(d.val)+"</b>")+"<br/>";
      var fItems=[];
      fuelTypes.forEach(function(f){
        if(d.byFuel[f]){
          var fv=metric==="vol"?lt(d.byFuel[f].litres):inr(d.byFuel[f].revenue);
          fItems.push('<span style="color:'+fuelColors[f]+'">● '+f+': '+fv+'</span>');
        }
      });
      if(fItems.length)th+='<div style="margin-top:3px;font-size:11px">'+fItems.join("<br/>")+'</div>';
      tooltip.html(th).style("display","block")
        .style("left",Math.min(width-170,Math.max(10,cx-80))+"px")
        .style("top","10px");
    })
    .on("mouseleave",function(){
      focusLine.style("display","none");tooltip.style("display","none");
    });
}

function renderD3MonthlyChart(monthlyData,metric){
  var container=document.getElementById("d3-monthly-chart");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!monthlyData||!monthlyData.length){
    container.innerHTML='<div class="empty">No monthly sales data available.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.max(300,rect.width||520);
  var height=220;
  var margin={top:28,right:16,bottom:35,left:metric==="rev"?60:50};

  var formatted=monthlyData.map(function(m){
    var parts=m.month.split("-");
    var monthNames=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    var label=monthNames[parseInt(parts[1],10)-1]+" '"+parts[0].slice(2);
    return {month:m.month,label:label,litres:m.litres||0,revenue:m.revenue||0,val:metric==="vol"?(m.litres||0):(m.revenue||0),duties:m.dutiesCount||0};
  });

  var svg=d3.select(container).append("svg")
    .attr("viewBox","0 0 "+width+" "+height).attr("width","100%").attr("height",height);
  var tooltip=d3.select(container).append("div").attr("class","chart-tooltip");

  var x=d3.scaleBand().domain(formatted.map(function(d){return d.label})).range([margin.left,width-margin.right]).padding(0.38);
  var yMax=d3.max(formatted,function(d){return d.val})||100;
  var y=d3.scaleLinear().domain([0,yMax*1.2]).range([height-margin.bottom,margin.top]);

  svg.append("g").attr("transform","translate("+margin.left+",0)")
    .call(d3.axisLeft(y).ticks(4).tickSize(-(width-margin.left-margin.right)).tickFormat(""))
    .call(function(g){g.select(".domain").remove();g.selectAll("line").attr("stroke","var(--line)").attr("stroke-opacity",0.5).attr("stroke-dasharray","3,3")});

  svg.append("g").attr("transform","translate(0,"+(height-margin.bottom)+")").call(d3.axisBottom(x))
    .call(function(g){g.select(".domain").attr("stroke","var(--line)");g.selectAll("text").attr("fill","var(--ink)").style("font-weight","600").style("font-size","12px");g.selectAll("line").remove()});

  svg.append("g").attr("transform","translate("+margin.left+",0)").call(d3.axisLeft(y).ticks(4).tickFormat(function(d){
    if(metric==="rev"){
      if(d>=100000)return "₹"+(d/100000).toFixed(1)+"L";
      return "₹"+(d/1000).toFixed(0)+"k";
    }else{
      if(d>=1000)return (d/1000).toFixed(0)+"k L";
      return d+" L";
    }
  })).call(function(g){g.select(".domain").remove();g.selectAll("text").attr("fill","var(--mute)").style("font-size","11px");g.selectAll("line").remove()});

  svg.selectAll(".bar").data(formatted).enter().append("rect").attr("class","bar")
    .attr("x",function(d){return x(d.label)}).attr("y",function(d){return y(d.val)})
    .attr("width",x.bandwidth()).attr("height",function(d){return Math.max(0,y(0)-y(d.val))})
    .attr("rx",5).attr("ry",5).attr("fill","#0b7a5f").style("cursor","pointer")
    .on("mouseenter",function(event,d){
      d3.select(this).attr("fill","#09634d");
      var th='<b>'+d.label+'</b><br/>Litres: <b>'+lt(d.litres)+'</b><br/>Revenue: <b>'+inr(d.revenue)+'</b><br/>Shifts: '+d.duties;
      tooltip.html(th).style("display","block")
        .style("left",Math.min(width-150,Math.max(10,x(d.label)-30))+"px")
        .style("top",Math.max(5,y(d.val)-50)+"px");
    })
    .on("mouseleave",function(){
      d3.select(this).attr("fill","#0b7a5f");tooltip.style("display","none");
    });

  svg.selectAll(".bar-label").data(formatted).enter().append("text")
    .attr("x",function(d){return x(d.label)+x.bandwidth()/2}).attr("y",function(d){return y(d.val)-6})
    .attr("text-anchor","middle").attr("fill","var(--ink)").style("font-size","11px").style("font-weight","600")
    .text(function(d){
      if(metric==="rev"){return d.val>=100000?"₹"+(d.val/100000).toFixed(1)+"L":"₹"+(d.val/1000).toFixed(0)+"k"}
      return d.val>=1000?(d.val/1000).toFixed(1)+"k L":d.val+" L";
    });

  if(formatted.length>1){
    var line=d3.line().x(function(d){return x(d.label)+x.bandwidth()/2}).y(function(d){return y(d.val)}).curve(d3.curveMonotoneX);
    svg.append("path").datum(formatted).attr("fill","none").attr("stroke","var(--warn)").attr("stroke-width",2).attr("stroke-dasharray","4,3").attr("d",line);
    svg.selectAll(".traj-dot").data(formatted).enter().append("circle")
      .attr("cx",function(d){return x(d.label)+x.bandwidth()/2}).attr("cy",function(d){return y(d.val)}).attr("r",3).attr("fill","var(--warn)");
  }
}

function renderD3ExpenseDonut(expenseData){
  var container=document.getElementById("d3-expense-donut");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!expenseData||!expenseData.length){
    container.innerHTML='<div class="empty">No expenses recorded in this period.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.min(360,Math.max(260,rect.width||320));
  var height=240;
  var radius=Math.min(width,height)/2-12;
  var innerRadius=radius*0.62;

  var colors=["#ef4444","#f59e0b","#3b82f6","#10b981","#8b5cf6","#ec4899","#6366f1","#14b8a6","#64748b"];
  var colorScale=d3.scaleOrdinal().range(colors);
  var totalAmt=d3.sum(expenseData,function(d){return d.amount});

  var svg=d3.select(container).append("svg")
    .attr("viewBox","0 0 "+width+" "+height).attr("width",width).attr("height",height)
    .append("g").attr("transform","translate("+(width/2)+","+(height/2)+")");

  var pie=d3.pie().value(function(d){return d.amount}).sort(null).padAngle(0.02);
  var arc=d3.arc().innerRadius(innerRadius).outerRadius(radius).cornerRadius(4);
  var arcHover=d3.arc().innerRadius(innerRadius-2).outerRadius(radius+7).cornerRadius(4);

  var centerLabel=svg.append("text").attr("text-anchor","middle").attr("dy","-4px").attr("fill","var(--ink)").style("font-size","17px").style("font-weight","800").text(inr(totalAmt));
  var centerSub=svg.append("text").attr("text-anchor","middle").attr("dy","18px").attr("fill","var(--mute)").style("font-size","11px").style("font-weight","600").text("Total Expenses");

  svg.selectAll(".slice").data(pie(expenseData)).enter().append("path").attr("class","slice")
    .attr("d",arc).attr("fill",function(d,i){return colorScale(i)}).style("cursor","pointer")
    .on("mouseenter",function(event,d){
      d3.select(this).transition().duration(150).attr("d",arcHover);
      centerLabel.text(inr(d.data.amount));
      centerSub.text(d.data.category+" ("+d.data.percentage+"%)");
    })
    .on("mouseleave",function(){
      d3.select(this).transition().duration(150).attr("d",arc);
      centerLabel.text(inr(totalAmt));
      centerSub.text("Total Expenses");
    });
}

function renderD3ExpenseBars(expenseData){
  var container=document.getElementById("d3-expense-bars");
  if(!container||typeof d3==="undefined")return;
  container.innerHTML="";
  if(!expenseData||!expenseData.length){
    container.innerHTML='<div class="empty">No expenses recorded in this period.</div>';
    return;
  }
  var rect=container.getBoundingClientRect();
  var width=Math.max(300,rect.width||520);
  var barHeight=36;
  var height=expenseData.length*barHeight+30;
  var margin={top:10,right:75,bottom:20,left:110};

  var colors=["#ef4444","#f59e0b","#3b82f6","#10b981","#8b5cf6","#ec4899","#6366f1","#14b8a6","#64748b"];
  var colorScale=d3.scaleOrdinal().range(colors);
  var maxVal=d3.max(expenseData,function(d){return d.amount})||100;

  var svg=d3.select(container).append("svg")
    .attr("viewBox","0 0 "+width+" "+height).attr("width","100%").attr("height",height);

  var y=d3.scaleBand().domain(expenseData.map(function(d){return d.category})).range([margin.top,height-margin.bottom]).padding(0.28);
  var x=d3.scaleLinear().domain([0,maxVal]).range([margin.left,width-margin.right]);

  svg.selectAll(".cat-label").data(expenseData).enter().append("text")
    .attr("x",margin.left-8).attr("y",function(d){return y(d.category)+y.bandwidth()/2+4})
    .attr("text-anchor","end").attr("fill","var(--ink)").style("font-size","12px").style("font-weight","600")

    });
  }
  if(SRV){
    return api("GET","/api/customers?all=1").then(function(r){
      if(Array.isArray(r)&&r.length) CL=r;
      else if((!CL||!CL.length)&&S&&S.c&&S.c.length){
        CL=S.c.map(function(c){
          var d=due(c);
          return {id:c.id,name:c.name,active:c.active!==false,veh:c.veh||[],available:Math.round(((c.limit||0)-d)*100)/100,due:d};
        });
      }

function cmCust(){

      c=(CL||[]).filter(function(x){return String(x.id)===String(custId)})[0]||(S&&S.c?find(custId):null),
      vl=document.getElementById("cm_vl");

    if(!c){d0.textContent="";return}
    var inf=[];
    var d=c.due!=null?c.due:due(c);
    if(d!=null)inf.push("Outstanding due: "+inr(d));
    if(c.available!=null)inf.push("Credit available: "+inr(c.available));

function cmCalc(){
  var nozSel=document.getElementById("cm_nozzle");
  var lines=(DF&&DF.lines&&DF.lines.length)?DF.lines:(S&&S.nozzles&&S.nozzles.length?S.nozzles:[]);
  var idx=nozSel?parseInt(nozSel.value,10):0;
  if(isNaN(idx)||idx<0||idx>=lines.length)idx=0;
  var line=lines[idx];
  var rate=line?fnum(line.rate):0;
  if(!rate&&line&&line.fuel&&S&&S.rates){
    var rObj=rateNow?rateNow(line.fuel,(DF&&DF.meta&&DF.meta.d)||DD||bizToday()):null;
    if(rObj)rate=fnum(rObj.rate);
  }
  var qtyEl=document.getElementById("cm_qty");
  var qty=qtyEl?parseFloat(qtyEl.value):NaN;
  var aEl=document.getElementById("cm4");
  var infoEl=document.getElementById("cm_calc_info");
  if(!isNaN(qty)&&qty>0&&rate>0){
    var tot=Math.round(qty*rate*100)/100;
    if(aEl)aEl.value=tot;
    if(infoEl)infoEl.innerHTML=qty+' L \u00d7 '+m2(rate)+'/L = <b>'+inr(tot)+'</b>';
  }else{
    if(aEl)aEl.value="";
    if(infoEl){
      if(rate>0){
        infoEl.textContent='Fuel rate of nozzle product: '+m2(rate)+'/L';
      }else{
        infoEl.innerHTML='<span style="color:var(--warn)">No fuel rate set for this nozzle product</span>';
      }
    }
  }
}

function saveRecoveryModal(editId){
  var a=parseFloat(v("rm3")),
      custId=v("rm1"),
      mode=v("rm2")||"Cash",
      note=(v("rm4")||"").trim(),
      e=document.getElementById("rmer");
  if(!custId){if(e)e.textContent="Choose a customer.";return}
  if(isNaN(a)||a<=0){if(e)e.textContent="Enter an amount above zero.";return}
  var c=(CL||[]).filter(function(x){return String(x.id)===String(custId)})[0]||(S&&S.c?find(custId):null);
  var cname=c?c.name:"Customer";
  var b={cust_id:String(custId),mode:mode,a:Math.round(a*100)/100,note:note};

  DF.recoveries=DF.recoveries||[];
  var existing=editId!=null?DF.recoveries.filter(function(x){return String(x.id)===String(editId)})[0]:null;
  var newEntry=null;
  if(existing){
    existing.cust_id=b.cust_id;
    existing.cname=cname;
    existing.mode=b.mode;
    existing.a=b.a;
    existing.note=b.note;
  }else{
    newEntry={
      id:Date.now(),
      cust_id:b.cust_id,
      cname:cname,
      mode:b.mode,
      a:b.a,
      note:b.note,
      d:today()
    };
    DF.recoveries.push(newEntry);
  }
  var totRec=DF.recoveries.reduce(function(acc,x){return acc+fnum(x.a)},0);
  DF.recovery=Math.round(totRec*100)/100;
  renderDF();
  close();
  autoSaveDuty(true);

  if(SRV){
    if(existing&&typeof existing.id==="number"&&existing.id<1e11){
      api("PUT","/api/credit-recoveries/"+existing.id,b).then(function(){
        refreshDutyRecoveries();
        pullDuty();
      }).catch(function(){});
    }else{
      var targetItem=existing||newEntry;
      api("POST","/api/credit-recoveries",Object.assign({},b,{duty_id:DF.id})).then(function(res){
        if(res&&res.id&&targetItem){targetItem.id=res.id}
        refreshDutyRecoveries();
        pullDuty();
      }).catch(function(){});
    }
  }else if(S&&S.c){
    var sc=find(b.cust_id);
    if(sc){
      sc.e=sc.e||[];
      sc.e.push({d:today(),t:"pay",n:"Duty collection ("+b.mode+(b.note?" \u00b7 "+b.note:"")+")",a:b.a,srv:"rec_"+Date.now()});
      save();
    }
  }
}
function removeRecovery(id,inModal){
  if(!DF)return;
  DF.recoveries=(DF.recoveries||[]).filter(function(x){return String(x.id)!==String(id)});
  var totRec=DF.recoveries.reduce(function(acc,x){return acc+fnum(x.a)},0);
  DF.recovery=Math.round(totRec*100)/100;
  renderDF();
  if(inModal){
    recoveryModal();
  }
  autoSaveDuty(true);

    api("DELETE","/api/credit-recoveries/"+id).then(function(){
      pullDuty();
    }).catch(function(err){
      toast(err.error||"Could not remove collection from server.");
    });
  }
}

  calcLubeAmount();

var totalCredit=(DF.credits&&DF.credits.length)?DF.credits.reduce(function(a,x){return a+(x.status!='rejected'?fnum(x.a):0)},0):fnum(DF.credit);DF.credit=totalCredit;
var totalRec=(DF.recoveries&&DF.recoveries.length)?DF.recoveries.reduce(function(a,x){return a+fnum(x.a)},0):fnum(DF.recovery);DF.recovery=totalRec;R=totalRec;
var ex=A+P+R-DF.credit-X,df=Math.round((C-ex)*100)/100;

var eTot=document.getElementById("expTotal");if(eTot&&document.activeElement!==eTot){eTot.value=X?X:""}

      amount:hasClosing?m2(amt):"-"
    };
  });
  totLitres=Math.round(totLitres*100)/100;
  totFuelSales=Math.round(totFuelSales*100)/100;

  var totLube=0;
  var lubeRows=[];
  (DF.items||[]).forEach(function(it){
    var s=(DF.stock||[]).find(function(x){return String(x.id)===String(it.item_id);});
    var qty=fnum(it.qty);
    if(qty>0){
      var price=s?s.sell:0;
      var amt=Math.round(qty*price*100)/100;
      totLube+=amt;
      lubeRows.push({name:s?s.name:"Item",qty:qty+" "+(s?s.unit:"pc"),price:m2(price),amount:m2(amt)});
    }
  });
  totLube=Math.round(totLube*100)/100;

  var totExp=0;
  (DF.exps||[]).forEach(function(x){totExp+=fnum(x.amount);});
  totExp=Math.round(totExp*100)/100;

  var totCredit=0;
  (DF.credits||[]).forEach(function(x){if(x.status!=="rejected")totCredit+=fnum(x.a);});
  totCredit=Math.round(totCredit*100)/100;

  var totRec=0;
  (DF.recoveries||[]).forEach(function(x){totRec+=fnum(x.a);});
  totRec=Math.round(totRec*100)/100;

  var expected=Math.round((totFuelSales+totLube+totRec-totCredit-totExp)*100)/100;

  var totCollected=0;
  var payRows=[];
  (DF.modes||[]).forEach(function(mode){
    var amt=fnum(DF.pay?DF.pay[mode.key]:0);
    totCollected+=amt;
    payRows.push({name:mode.name,amount:m2(amt)});
  });
  totCollected=Math.round(totCollected*100)/100;
  var diff=Math.round((totCollected-expected)*100)/100;

  var h='<h2>Please confirm</h2>'
    +'<div class="sub" style="margin-bottom:12px">All shift details are shown below. Please review carefully before submitting to your manager.</div>';

  if(missingClosing.length){
    h+='<div class="cust" style="background:#fff3cd;border-color:#ffeeba;color:#856404;margin-bottom:12px;padding:10px 12px;cursor:default">'
      +'⚠️ <b>Missing closing reading:</b> '+esc(missingClosing.join(", "))+'. Enter closing readings before submitting.'
      +'</div>';
  }
  if(invalidNozzles.length){
    h+='<div class="cust" style="background:#f8d7da;border-color:#f5c6cb;color:#721c24;margin-bottom:12px;padding:10px 12px;cursor:default">'
      +'⚠️ <b>Readings error:</b><br>'+invalidNozzles.map(esc).join("<br>")
      +'</div>';
  }

  h+='<div class="cust" style="cursor:default;margin-bottom:12px;padding:12px">'
    +'<div class="row"><b>'+esc(m.shift||"Shift")+' duty</b><span class="sub" style="flex:none"><b>'+esc(m.d||today())+'</b></span></div>'
    +'<div class="sub" style="margin-top:2px">Worker: '+esc(ME?ME.name:"Worker")+'</div>'
    +'</div>';

  h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Nozzle readings</div>';
  h+='<div class="tbl" style="margin-bottom:12px"><table>'
    +'<tr><th>Nozzle</th><th class="r">Open</th><th class="r">Close</th><th class="r">Test</th><th class="r">Litres</th><th class="r">Rate</th><th class="r">Amount</th></tr>';
  lineRows.forEach(function(l){
    h+='<tr><td>'+esc(l.name)+'<div class="sub">'+esc(l.fuel)+'</div></td>'
      +'<td class="r">'+l.opening+'</td>'
      +'<td class="r">'+l.closing+'</td>'
      +'<td class="r">'+l.testing+'</td>'
      +'<td class="r"><b>'+l.litres+'</b></td>'
      +'<td class="r">'+l.rate+'</td>'
      +'<td class="r"><b>'+l.amount+'</b></td></tr>';
  });
  h+='<tr><td colspan="4"><b>Total fuel sales</b></td><td class="r"><b>'+totLitres+' L</b></td><td></td><td class="r"><b>'+inr(totFuelSales)+'</b></td></tr>';
  h+='</table></div>';

  if(lubeRows.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Lubes & shop items sold</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Item</th><th class="r">Qty</th><th class="r">Price</th><th class="r">Amount</th></tr>';
    lubeRows.forEach(function(r){
      h+='<tr><td>'+esc(r.name)+'</td><td class="r">'+esc(r.qty)+'</td><td class="r">'+r.price+'</td><td class="r"><b>'+r.amount+'</b></td></tr>';
    });

  }

  if(DF.recoveries&&DF.recoveries.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Credit recovery collections</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Customer</th><th>Mode</th><th class="r">Amount</th></tr>';
    DF.recoveries.forEach(function(r){
      h+='<tr><td>'+esc(r.cname||"Customer")+(r.note?'<div class="sub">'+esc(r.note)+'</div>':'')+'</td><td>'+esc(r.mode||"Cash")+'</td><td class="r pay"><b>+'+inr(fnum(r.a))+'</b></td></tr>';
    });
    h+='<tr><td colspan="2"><b>Total recovery</b></td><td class="r pay"><b>+'+inr(totRec)+'</b></td></tr>';
    h+='</table></div>';
  }

  if(DF.credits&&DF.credits.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Credit sales given</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Customer</th><th>Detail</th><th class="r">Amount</th></tr>';
    DF.credits.forEach(function(c){
      h+='<tr><td>'+esc(c.cname||"Customer")+'</td><td>'+esc(c.n||"")+(c.veh?' · '+esc(c.veh):'')+'</td><td class="r"><b>'+inr(fnum(c.a))+'</b></td></tr>';
    });
    h+='<tr><td colspan="2"><b>Total credit sales</b></td><td class="r"><b>'+inr(totCredit)+'</b></td></tr>';
    h+='</table></div>';
  }

  if(DF.exps&&DF.exps.length){
    h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:10px 0 4px">Expenses paid from till</div>';
    h+='<div class="tbl" style="margin-bottom:12px"><table><tr><th>Category</th><th>Detail</th><th class="r">Amount</th></tr>';
    DF.exps.forEach(function(e){
      h+='<tr><td>'+esc(e.cat)+'</td><td>'+esc(e.note||"No detail")+'</td><td class="r"><b>'+inr(fnum(e.amount))+'</b></td></tr>';
    });

  var T=function(a,b,col){return '<tr><td>'+a+'</td><td class="r"'+(col?' style="color:'+col+'"':'')+'>'+b+'</td></tr>';};

function doWorkerDutySubmit(){
  if(!DF||!DF.id)return;
  var errDiv=document.getElementById("confirmDutyErr");

  for(var i=0;i<(DF.lines||[]).length;i++){
    var l=DF.lines[i];
    var nn=l.name||"Nozzle";
    if(l.closing===""||l.closing==null||isNaN(parseFloat(l.closing))){
      if(errDiv)errDiv.textContent="Please enter the closing reading for "+nn+" before submitting.";
      return;
    }
    var clStr=String(l.closing).trim();
    if(clStr.indexOf('.')!==-1&&clStr.split('.')[1].length>2){
      if(errDiv)errDiv.textContent="Closing reading for "+nn+" must be up to two decimals.";
      return;
    }
    var opStr=String(l.opening).trim();
    if(opStr.indexOf('.')!==-1&&opStr.split('.')[1].length>2){
      if(errDiv)errDiv.textContent="Opening reading for "+nn+" must be up to two decimals.";
      return;
    }
    var op=parseFloat(l.opening)||0,cl=parseFloat(l.closing)||0,ts=parseFloat(l.testing)||0;
    if(cl<op){
      if(errDiv)errDiv.textContent="Closing reading ("+cl.toFixed(2)+") is less than opening reading ("+op.toFixed(2)+") for "+nn+".";
      return;
    }
    if(ts>(cl-op)){
      if(errDiv)errDiv.textContent="Testing litres ("+ts.toFixed(2)+") exceed fuel dispensed ("+(cl-op).toFixed(2)+") for "+nn+".";
      return;
    }
  }

  var btn=document.getElementById("btnConfirmSubmit");
  if(btn){
    btn.disabled=true;
    btn.textContent="Submitting...";
  }

  if(autoSaveTimer){clearTimeout(autoSaveTimer);autoSaveTimer=null;}
  autoSavePending=false;

  api("POST","/api/duty/"+DF.id+"/submit",dpay()).then(function(){
    try{localStorage.removeItem("petrol_duty_draft_"+DF.id);}catch(e){}
    setAutoSaveStatus("","");
    closeM();
    toast("Duty submitted to manager successfully!");
    loadW();
  }).catch(function(e){
    if(btn){
      btn.disabled=false;
      btn.textContent="Confirm & Submit duty";
    }
    if(errDiv)errDiv.textContent=e.error||"Could not submit duty. Check your connection.";
    else toast(e.error||"Could not submit duty.");
  });
}

function printSingleDuty(dutyOrId) {
  var id = (typeof dutyOrId === "object" && dutyOrId && dutyOrId.id) ? dutyOrId.id : dutyOrId;
  if (!id) {
    toast("No duty selected to print.");
    return;
  }
  toast("Preparing shift handover voucher for print...");
  var req = (typeof dutyOrId === "object" && dutyOrId && dutyOrId.lines && dutyOrId.lines.length)
    ? Promise.resolve(dutyOrId)
    : ((ME && ME.role === "worker")
        ? api("GET", "/api/my-duties/" + id).then(function(r){ return r.duty || r; })
        : api("GET", "/api/duties/" + id).then(function(r){ return r.duty || r; }).catch(function(){
            return api("GET", "/api/my-duties/" + id).then(function(r){ return r.duty || r; });
          }));

  req.then(function(duty){
    if (!duty) {
      toast("Duty record not found.");
      return;
    }
    openDutyPrintModal(duty);
  }).catch(function(e){
    toast((e && e.error) || "Could not load duty details for print.");
  });
}

function triggerDutyDirectPrint(identifier) {
  var modalEl = document.getElementById("modal");
  if (modalEl) modalEl.classList.add("print-active");
  document.body.classList.add("printing-voucher");

  var voucherEl = document.getElementById("dutyVoucherPrintable");

      '.voucher-box { border: 1px solid #cbd5e1; border-radius: 6px; padding: 8px 10px; margin-top: 8px; background: #fafafa; }' +
      '.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0; }' +

      '.kpi-val { font-size: 13px; font-weight: 800; margin-top: 2px; }' +

      '.sign-box { border: 1px solid #cbd5e1; border-radius: 6px; padding: 10px 8px; text-align: center; }' +

      contentHtml +
      '</body></html>');
    frameDoc.close();

    setTimeout(function(){
      try {
        iframe.contentWindow.focus();
        iframe.contentWindow.print();
      } catch (errIframe) {
        console.warn("Iframe print threw, falling back to window.print():", errIframe);
        window.focus();
        window.print();
      }
    }, 150);
  } catch (err) {

    window.focus();

  }, 2500);
}

function downloadDayDutiesPDF(dateStr){
  dateStr = dateStr || DD || today();
  var jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!jsPDF) {
    toast("Opening print preview...");
    printDutyDaySheet();
    return;
  }
  toast("Preparing Daily Duties PDF...");
  Promise.all([
    api("GET", "/api/duties?d=" + dateStr),
    api("GET", "/api/day-report?d=" + dateStr).catch(function(){ return null; })
  ]).then(function(res){
    var dutyRes = res[0] || {};
    var duties = dutyRes.day || [];
    var biz = (S && S.biz) || {};
    var bName = biz.name || "PETRO NETRA FUEL PLAZA";
    var bGst = biz.gst ? ("GSTIN: " + biz.gst) : "";

    var doc = new jsPDF({ orientation: "portrait", unit: "pt", format: "a4" });
    var runTable = function(opts) {
      if (typeof doc.autoTable === "function") doc.autoTable(opts);
      else if (window.jspdf && typeof window.jspdf.autoTable === "function") window.jspdf.autoTable(doc, opts);
    };

    doc.setFillColor(6, 42, 107);
    doc.rect(0, 0, 595.28, 64, "F");
    doc.setTextColor(255, 255, 255);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(14);
    doc.text(bName.toUpperCase(), 30, 24);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(9);
    doc.setTextColor(205, 225, 248);
    doc.text("CONSOLIDATED SHIFT DUTIES & DAY AUDIT REGISTER — " + dateStr, 30, 39);
    if (bGst) doc.text(bGst + "   |   Status: " + (dutyRes.day_status || "open").toUpperCase(), 30, 52);

    var curY = 78;
    var T = { l: 0, s: 0, k: 0, d: 0 };
    var rows = duties.map(function(d){
      T.l += Number(d.litres || 0);
      T.s += Number(d.sales || 0) + Number(d.lube || 0);
      T.k += Number(d.collected || 0);
      T.d += Number(d.diff || 0);
      return [
        "#" + d.id,
        d.worker || "Attendant",
        d.shift || "Morning",
        d.status || "closed",
        Number(d.litres || 0).toFixed(2) + " L",
        "INR " + Number((d.sales || 0) + (d.lube || 0)).toLocaleString("en-IN", {minimumFractionDigits: 2}),
        "INR " + Number(d.collected || 0).toLocaleString("en-IN", {minimumFractionDigits: 2}),
        (d.diff >= 0 ? "+" : "") + Number(d.diff || 0).toFixed(2)
      ];
    });

    rows.push([
      "TOTAL",
      "",
      "",
      duties.length + " Duties",
      Number(T.l).toFixed(2) + " L",
      "INR " + Number(T.s).toLocaleString("en-IN", {minimumFractionDigits: 2}),
      "INR " + Number(T.k).toLocaleString("en-IN", {minimumFractionDigits: 2}),
      (T.d >= 0 ? "+" : "") + Number(T.d).toFixed(2)
    ]);

    runTable({
      startY: curY,
      margin: { left: 30, right: 30 },
      head: [["Duty ID", "Attendant", "Shift", "Status", "Litres", "Gross Sales", "Collected", "Variance"]],
      body: rows,
      theme: "striped",
      headStyles: { fillColor: [6, 42, 107], textColor: 255, fontSize: 8, fontStyle: "bold" },
      styles: { fontSize: 8, cellPadding: 4 },
      columnStyles: {
        0: { cellWidth: 45 },
        1: { cellWidth: 100, fontStyle: "bold" },
        2: { cellWidth: 55 },
        3: { cellWidth: 55 },
        4: { halign: "right", cellWidth: 65, fontStyle: "bold" },
        5: { halign: "right", cellWidth: 75 },
        6: { halign: "right", cellWidth: 75, fontStyle: "bold" },
        7: { halign: "right", cellWidth: 65 }
      },
      didParseCell: function(data){
        if (data.row.index === rows.length - 1) {
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [240, 245, 250];
        }
      }
    });

    var safeFileName = "Day_Shift_Duties_" + dateStr.replace(/[^a-zA-Z0-9_-]/g, "_") + ".pdf";
    doc.save(safeFileName);
    toast("PDF day duties sheet downloaded: " + safeFileName);
  }).catch(function(e){
    toast("Could not generate day PDF: " + ((e && e.error) || "Error"));
  });
}

function downloadDutyPDF(dutyOrId) {
  var jsPDF = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
  if (!jsPDF) {
    toast("PDF engine unavailable, opening print preview.");
    window.print();
    return;
  }
  if (typeof dutyOrId === "object" && dutyOrId && dutyOrId.id) {
    generateDutyPDFDoc(dutyOrId);
    return;
  }
  var id = dutyOrId;
  if (!id) {
    toast("No duty selected for PDF generation.");
    return;
  }
  toast("Preparing PDF handover receipt...");
  var req = (ME && ME.role === "worker")
    ? api("GET", "/api/my-duties/" + id).then(function(r){ return r.duty; })
    : api("GET", "/api/duties/" + id).catch(function(){
        return api("GET", "/api/my-duties/" + id).then(function(r){ return r.duty; });
      });

  req.then(function(duty){
    if (!duty) {
      toast("Duty record not found.");
      return;
    }
    generateDutyPDFDoc(duty);
  }).catch(function(e){
    toast(e.error || "Could not load duty details for PDF.");
  });
}

  doc.text("Handover Record: Duty #" + d.id + " (" + (d.status || "completed") + ")", 40, curY + 73);

  // Right Box: Shift Settlement Summary KPIs
  doc.setFont("helvetica", "bold");
  doc.setFontSize(8.5);
  doc.setTextColor(100, 115, 120);
  doc.text("FINANCIAL SUMMARY AT A GLANCE", 315, curY + 16);

  var totalSalesVal = (d.sales || 0) + (d.lube || 0);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(10.5);
  doc.setTextColor(22, 38, 43);
  doc.text("Gross Sales: INR " + Number(totalSalesVal).toLocaleString("en-IN", {minimumFractionDigits: 2}), 315, curY + 32);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(8.5);
  doc.setTextColor(80, 95, 100);
  doc.text("Fuel Sold: " + Number(d.litres || 0).toLocaleString("en-IN", {minimumFractionDigits: 2}) + " Litres", 315, curY + 47);
  doc.text("Collections Received: INR " + Number(d.collected || 0).toLocaleString("en-IN", {minimumFractionDigits: 2}), 315, curY + 60);

  var diffVal = Number(d.diff || 0);
  var diffLabel = Math.abs(diffVal) < 1 ? "Balanced (0.00)" : ((diffVal > 0 ? "+" : "") + "INR " + diffVal.toFixed(2) + (diffVal < 0 ? " Shortage" : " Excess"));
  if (Math.abs(diffVal) < 1) {
    doc.setTextColor(11, 122, 95);
  } else {
    doc.setTextColor(184, 50, 31);
  }
  doc.setFont("helvetica", "bold");
  doc.text("Cash Variance: " + diffLabel, 315, curY + 73);

  curY += 92;

  // Function to ensure vertical space
  var ensureSpace = function(neededPt) {
    if (curY + neededPt > 790) {
      doc.addPage();
      curY = 36;
    }
  };

  // Section 1: Nozzle Readings & Meter Dispensing
  ensureSpace(40);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9.5);
  doc.setTextColor(22, 38, 43);
  doc.text("1. NOZZLE TOTALIZER READINGS & DISPENSED SALES", 30, curY);

  var nozBody = (d.lines || []).map(function(l) {
    var opStr = l.opening != null ? Number(l.opening).toFixed(2) : "-";
    var clStr = l.closing != null ? Number(l.closing).toFixed(2) : "-";
    var tsStr = l.testing != null ? Number(l.testing).toFixed(2) : "0.00";
    var ltStr = l.litres != null ? Number(l.litres).toFixed(2) : "0.00";
    var rtStr = l.rate != null ? Number(l.rate).toFixed(2) : "-";
    var amStr = l.amount != null ? Number(l.amount).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2}) : "0.00";
    return [
      (l.nozzle || "Nozzle") + (l.fuel ? " (" + l.fuel + ")" : ""),
      opStr,
      clStr,
      tsStr,
      ltStr + " L",
      rtStr,
      amStr
    ];
  });

  // Total summary row for nozzles
  nozBody.push([
    "TOTAL FUEL SALES",
    "",
    "",
    "",
    Number(d.litres || 0).toFixed(2) + " L",
    "",
    "INR " + Number(d.sales || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
  ]);

  runTable({
    startY: curY + 6,
    margin: { left: 30, right: 30 },
    head: [["Dispenser Nozzle & Fuel", "Opening Meter", "Closing Meter", "5L Test", "Net Litres", "Rate / L", "Total (INR)"]],
    body: nozBody,
    theme: "striped",
    headStyles: { fillColor: [22, 38, 43], textColor: 255, fontSize: 8, fontStyle: "bold" },
    styles: { fontSize: 7.5, cellPadding: 3.5 },
    columnStyles: {
      0: { cellWidth: 155, fontStyle: "bold" },
      1: { halign: "right", cellWidth: 62 },
      2: { halign: "right", cellWidth: 62 },
      3: { halign: "right", cellWidth: 46 },
      4: { halign: "right", cellWidth: 65, fontStyle: "bold" },
      5: { halign: "right", cellWidth: 55 },
      6: { halign: "right", cellWidth: 90, fontStyle: "bold" }
    },
    didParseCell: function(data) {
      if (data.row.index === nozBody.length - 1) {
        data.cell.styles.fontStyle = "bold";
        data.cell.styles.fillColor = [240, 245, 245];
        if (data.column.index === 6 || data.column.index === 4) {
          data.cell.styles.textColor = [11, 122, 95];
        }
      }
    }
  });

  curY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : curY) + 14;

  // Section 2: Lubes & Shop Items (if any)
  if (d.items && d.items.length) {
    ensureSpace(35);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(22, 38, 43);
    doc.text("2. LUBRICANTS & FORECOURT SHOP SALES", 30, curY);

    var itemBody = d.items.map(function(it) {
      return [
        it.name || "Item",
        String(it.qty || 1),
        Number(it.price || 0).toFixed(2),
        Number(it.amount || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
      ];
    });
    itemBody.push([
      "TOTAL LUBE & SHOP SALES",
      "",
      "",
      "INR " + Number(d.lube || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
    ]);

    runTable({
      startY: curY + 6,
      margin: { left: 30, right: 30 },
      head: [["Item Description", "Qty", "Unit Price (INR)", "Amount (INR)"]],
      body: itemBody,
      theme: "striped",
      headStyles: { fillColor: [40, 60, 70], textColor: 255, fontSize: 8, fontStyle: "bold" },
      styles: { fontSize: 7.5, cellPadding: 3.5 },
      columnStyles: {
        0: { cellWidth: 265, fontStyle: "bold" },
        1: { halign: "right", cellWidth: 60 },
        2: { halign: "right", cellWidth: 80 },
        3: { halign: "right", cellWidth: 130, fontStyle: "bold" }
      },
      didParseCell: function(data) {
        if (data.row.index === itemBody.length - 1) {
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [240, 245, 245];
        }
      }
    });

    curY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : curY) + 14;
  }

  // Section 3: Expenses Deducted (if any)
  if (d.expenses && d.expenses.length) {
    ensureSpace(35);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(22, 38, 43);
    doc.text("3. FORECOURT OPERATING EXPENSES (PAID FROM SHIFT CASH)", 30, curY);

    var expBody = d.expenses.map(function(e) {
      return [
        e.cat || "General Expense",
        e.note || "Forecourt voucher / bill",
        Number(e.amount || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
      ];
    });
    expBody.push([
      "TOTAL SHIFT EXPENSES DEDUCTED",
      "",
      "INR " + Number(d.exp || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
    ]);

    runTable({
      startY: curY + 6,
      margin: { left: 30, right: 30 },
      head: [["Expense Category", "Voucher Description / Notes", "Amount Deducted (INR)"]],
      body: expBody,
      theme: "striped",
      headStyles: { fillColor: [75, 45, 45], textColor: 255, fontSize: 8, fontStyle: "bold" },
      styles: { fontSize: 7.5, cellPadding: 3.5 },
      columnStyles: {
        0: { cellWidth: 160, fontStyle: "bold" },
        1: { cellWidth: 245 },
        2: { halign: "right", cellWidth: 130, fontStyle: "bold" }
      },
      didParseCell: function(data) {
        if (data.row.index === expBody.length - 1) {
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [253, 242, 242];
          if (data.column.index === 2) data.cell.styles.textColor = [184, 50, 31];
        }
      }
    });

    curY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : curY) + 14;
  }

  // Section 4: Credit Fuel Sales / Indents (if any)
  if (d.credit_sales && d.credit_sales.length) {
    ensureSpace(35);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(22, 38, 43);
    doc.text("4. CREDIT FUEL SALES (INDENTS & FLEET KHATA)", 30, curY);

    var csBody = d.credit_sales.map(function(c) {
      var ref = [c.veh, c.n].filter(Boolean).join(" · ") || "Indent / Credit Slip";
      return [
        c.cname || "Credit Customer",
        ref,
        Number(c.a || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
      ];
    });
    csBody.push([
      "TOTAL CREDIT FUEL SALES",
      "",
      "INR " + Number(d.credit || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
    ]);

    runTable({
      startY: curY + 6,
      margin: { left: 30, right: 30 },
      head: [["Customer / Fleet Account", "Vehicle / Indent Reference", "Credit Amount (INR)"]],
      body: csBody,
      theme: "striped",
      headStyles: { fillColor: [55, 65, 81], textColor: 255, fontSize: 8, fontStyle: "bold" },
      styles: { fontSize: 7.5, cellPadding: 3.5 },
      columnStyles: {
        0: { cellWidth: 180, fontStyle: "bold" },
        1: { cellWidth: 225 },
        2: { halign: "right", cellWidth: 130, fontStyle: "bold" }
      },
      didParseCell: function(data) {
        if (data.row.index === csBody.length - 1) {
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [243, 244, 246];
        }
      }
    });

    curY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : curY) + 14;
  }

  // Section 5: Credit Recoveries (if any)
  if (d.credit_recoveries && d.credit_recoveries.length) {
    ensureSpace(35);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(9.5);
    doc.setTextColor(22, 38, 43);
    doc.text("5. CREDIT RECOVERIES (PAST OUTSTANDING COLLECTED)", 30, curY);

    var crBody = d.credit_recoveries.map(function(cr) {
      var note = [cr.mode, cr.note].filter(Boolean).join(" · ") || "Cash recovery";
      return [
        cr.cname || "Customer",
        note,
        Number(cr.a || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
      ];
    });
    crBody.push([
      "TOTAL RECOVERIES COLLECTED",
      "",
      "INR " + Number(d.recovery || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
    ]);

    runTable({
      startY: curY + 6,
      margin: { left: 30, right: 30 },
      head: [["Customer Name", "Payment Mode & Notes", "Recovered Amount (INR)"]],
      body: crBody,
      theme: "striped",
      headStyles: { fillColor: [15, 82, 60], textColor: 255, fontSize: 8, fontStyle: "bold" },
      styles: { fontSize: 7.5, cellPadding: 3.5 },
      columnStyles: {
        0: { cellWidth: 180, fontStyle: "bold" },
        1: { cellWidth: 225 },
        2: { halign: "right", cellWidth: 130, fontStyle: "bold" }
      },
      didParseCell: function(data) {
        if (data.row.index === crBody.length - 1) {
          data.cell.styles.fontStyle = "bold";
          data.cell.styles.fillColor = [235, 248, 243];
          if (data.column.index === 2) data.cell.styles.textColor = [11, 122, 95];
        }
      }
    });

    curY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : curY) + 14;
  }

  // Section 6: Collections Breakdown & Settlement Reconciliation
  ensureSpace(120);
  doc.setFont("helvetica", "bold");
  doc.setFontSize(9.5);
  doc.setTextColor(22, 38, 43);
  doc.text("6. CASH COLLECTIONS & SHIFT SETTLEMENT RECONCILIATION", 30, curY);

  var mn = (typeof mname === "function") ? mname() : { cash: "Cash", upi: "UPI / QR", card: "Card (POS)" };
  var payObj = d.pay || {};

  var reconRows = [
    ["Gross Fuel Sales (Dispenser readings)", "INR " + Number(d.sales || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})],
    ["Lubes & Forecourt Shop Sales", "INR " + Number(d.lube || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})],
    ["Total Gross Sales (A)", "INR " + Number((d.sales || 0) + (d.lube || 0)).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})],
    ["(+) Credit Recoveries Collected (B)", "+ INR " + Number(d.recovery || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})],
    ["(-) Less Credit Sales / Indents (C)", "- INR " + Number(d.credit || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})],
    ["(-) Less Forecourt Expenses Paid (D)", "- INR " + Number(d.exp || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})],
    ["EXPECTED TOTAL CASH & PAYMENTS (A + B - C - D)", "INR " + Number(d.expected || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})]
  ];

  // Add individual payment modes collected
  Object.keys(payObj).filter(function(k){ return k[0] !== '_'; }).forEach(function(k){
    var modeName = mn[k] || (k.charAt(0).toUpperCase() + k.slice(1));
    var amt = Number(payObj[k] || 0);
    reconRows.push(["    • Collected via " + modeName, "INR " + amt.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})]);
  });

  reconRows.push(["TOTAL ACTUAL COLLECTIONS RECEIVED", "INR " + Number(d.collected || 0).toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})]);

  var netDiff = Number(d.diff || 0);
  var diffText = (netDiff >= 0 ? "+" : "") + "INR " + netDiff.toLocaleString("en-IN", {minimumFractionDigits: 2, maximumFractionDigits: 2})
    + (Math.abs(netDiff) < 1 ? "  (BALANCED ✓)" : (netDiff < 0 ? "  (SHORTAGE ⚠)" : "  (EXCESS)"));
  reconRows.push(["NET SHORTAGE / EXCESS VARIANCE", diffText]);

  runTable({
    startY: curY + 6,
    margin: { left: 30, right: 30 },
    head: [["Reconciliation Item", "Amount (INR)"]],
    body: reconRows,
    theme: "striped",
    headStyles: { fillColor: [22, 38, 43], textColor: 255, fontSize: 8, fontStyle: "bold" },
    styles: { fontSize: 7.5, cellPadding: 3.5 },
    columnStyles: {
      0: { cellWidth: 380, fontStyle: "normal" },
      1: { halign: "right", cellWidth: 155, fontStyle: "bold" }
    },
    didParseCell: function(data) {
      var idx = data.row.index;
      if (idx === 2 || idx === 6 || idx === reconRows.length - 2 || idx === reconRows.length - 1) {
        data.cell.styles.fontStyle = "bold";
      }
      if (idx === 6) {
        data.cell.styles.fillColor = [240, 245, 248];
      }
      if (idx === reconRows.length - 2) {
        data.cell.styles.fillColor = [235, 248, 243];
        if (data.column.index === 1) data.cell.styles.textColor = [11, 122, 95];
      }
      if (idx === reconRows.length - 1) {
        if (Math.abs(netDiff) < 1) {
          data.cell.styles.fillColor = [235, 248, 243];
          if (data.column.index === 1) data.cell.styles.textColor = [11, 122, 95];
        } else {
          data.cell.styles.fillColor = [253, 237, 235];
          if (data.column.index === 1) data.cell.styles.textColor = [184, 50, 31];
        }
      }
    }
  });

  curY = (doc.lastAutoTable ? doc.lastAutoTable.finalY : curY) + 14;

  // Handover Note / Remarks (if present)
  if (d.note) {
    ensureSpace(40);
    doc.setFont("helvetica", "bold");
    doc.setFontSize(8.5);
    doc.setTextColor(70, 85, 90);
    doc.text("HANDOVER REMARKS / NOTES:", 30, curY);

    doc.setFont("helvetica", "normal");
    doc.setFontSize(8);
    doc.setTextColor(30, 40, 45);
    var splitNotes = doc.splitTextToSize(String(d.note), 535);
    doc.text(splitNotes, 30, curY + 12);
    curY += 16 + (splitNotes.length * 9);
  }

  // Sign-off / Signature blocks
  ensureSpace(60);
  doc.setDrawColor(200, 210, 215);
  doc.setFillColor(250, 252, 252);
  doc.roundedRect(30, curY, 535, 52, 4, 4, "FD");

  doc.setFont("helvetica", "bold");
  doc.setFontSize(8);
  doc.setTextColor(80, 95, 100);

  doc.text("Outgoing Attendant", 45, curY + 16);
  doc.text("Incoming Attendant / Receiver", 215, curY + 16);
  doc.text("Station Manager / Owner", 400, curY + 16);

  doc.setFont("helvetica", "normal");
  doc.setFontSize(7.5);
  doc.setTextColor(110, 125, 130);
  doc.text("Signature: __________________", 45, curY + 36);
  doc.text("Signature: __________________", 215, curY + 36);
  doc.text("Signature: __________________", 400, curY + 36);

  doc.setFontSize(7);
  doc.text((d.worker || "Attendant"), 45, curY + 46);
  doc.text("Relieving Staff", 215, curY + 46);
  doc.text("Verified & Approved", 400, curY + 46);

  // Add footer to all pages
  var pageCount = doc.internal.getNumberOfPages();
  for (var i = 1; i <= pageCount; i++) {
    doc.setPage(i);
    doc.setFont("helvetica", "normal");
    doc.setFontSize(7);
    doc.setTextColor(140, 155, 160);
    doc.text(
      "Page " + i + " of " + pageCount + "   |   Handover Receipt #" + d.id + " (" + d.d + " " + (d.shift || "") + ")   |   " + bizName,
      30,
      830
    );
  }

  var safeFileName = "Shift_Handover_Receipt_Duty_" + d.id + "_" + (d.d || "date").replace(/[^a-zA-Z0-9_-]/g, "_") + ".pdf";
  doc.save(safeFileName);
  toast("PDF handover receipt downloaded: " + safeFileName);
}
// ---- Worker
function loadW(){
  tab="wduty";
  document.body.classList.add("logged-in");
  renderDrawerContent();
  document.getElementById("app").innerHTML=ubar()+wnav()+'<div class="empty">Loading shift duty details…</div>';
  if(!SRV){
    WD={duty:null,modes:allModes(),cats:cats(),items:(S&&S.items)||[],recent:[]};
    return renderW();
  }
  var cachedRaw=null;
  try{cachedRaw=localStorage.getItem("petrol_cached_duty");}catch(e){}

  Promise.all([
    api("GET","/api/duty/current").catch(function(e){
      console.warn("api /api/duty/current failed:", e);
      if(e&&e.status===401) throw e;
      if(cachedRaw){
        try{return JSON.parse(cachedRaw);}catch(_){}
      }
      return {duty:null,modes:allModes(),cats:cats(),items:(S&&S.items)||[],recent:[]};
    }),
    fetchCL()
  ]).then(function(r){
    WD=r[0]||{duty:null,modes:allModes(),cats:cats(),items:(S&&S.items)||[],recent:[]};
    try{localStorage.setItem("petrol_cached_duty",JSON.stringify(WD));}catch(e){}
    renderW();
  }).catch(function(e){
    console.error("loadW error:", e);
    if(e&&e.status===401){
      document.getElementById("app").innerHTML=ubar()+wnav()+'<div class="empty">'
        +'<b>Session expired</b>'
        +'<div class="sub" style="margin-top:6px">Please sign in again to view your shift duties.</div>'
        +'<div style="margin-top:14px"><button onclick="authView(false)">Sign in</button></div>'
        +'</div>';
      return;
    }
    if(cachedRaw){
      try{
        WD=JSON.parse(cachedRaw);
        toast("Loaded cached shift data (offline).");
        return renderW();
      }catch(_){}
    }
    document.getElementById("app").innerHTML=ubar()+wnav()+'<div class="empty">'
      +'<div style="font-size:32px;margin-bottom:8px">📡</div>'
      +'<b>Could not load shift duty.</b>'
      +'<div class="sub" style="margin-top:4px">'+esc((e&&e.error)||(e&&e.message)||"Check your connection.")+'</div>'
      +'<div style="margin-top:14px;display:flex;gap:10px;justify-content:center">'
      +'<button onclick="loadW()">Try again</button>'
      +'<button class="ghost" onclick="WD={duty:null,modes:allModes(),cats:cats(),items:(S&&S.items)||[],recent:[]};renderW()">Open offline duty</button>'
      +'</div></div>';
  });
}
function renderW(){
  if(!WD) WD={duty:null,modes:allModes(),cats:cats(),items:(S&&S.items)||[],recent:[]};
  if(WD.duty){
    var dObj=fromDuty(WD.duty,{modes:WD.modes||allModes(),cats:WD.cats||cats(),items:WD.items||(S&&S.items)||[]},"worker");
    if(dObj){
      DF=dObj;
      return renderDF();
    }
  }
  var h=ubar()+wnav()+'<h1>My duty</h1>'
    +'<div class="cust" style="cursor:default;margin-bottom:14px;padding:12px">'
    +'<div class="row"><b>No active duty in progress</b><span class="sub" style="flex:none;color:var(--ok)">Ready for shift</span></div>'
    +'<div class="sub" style="margin-top:4px">Hand over duty and starting nozzle readings to an incoming colleague for the next shift.</div>'
    +'<div class="btns" style="margin:10px 0 0"><button onclick="tab=\'wassign\';loadWAssign()">🤝 Handover duty</button></div>'
    +'</div>'
    +'<h1 style="margin-top:22px">My recent duties</h1>';
  var recentList = (WD && Array.isArray(WD.recent)) ? WD.recent : [];
  if(!recentList.length)h+='<div class="empty">No duties yet.</div>';
  else recentList.forEach(function(d){
    var dfNum = parseFloat(d.diff) || 0;
    var dfCol = (dfNum < -0.01) ? 'var(--due)' : 'var(--ok)';
    var dfText = (dfNum < -0.01) ? ('Shortage ' + sgn(dfNum)) : (dfNum > 0.01 ? ('Excess ' + sgn(dfNum)) : 'Balanced ₹0');
    h+='<div class="cust" tabindex="0" onclick="viewMyDuty('+d.id+')"><div class="row"><b>'+esc(d.shift||"Shift")+' \u00b7 '+esc(d.d||"")+'</b><span class="sub" style="flex:none;color:'+(d.status=="closed"?'var(--ok)':'var(--warn)')+'">'+(d.status=="closed"?"Closed":"Waiting for manager")+'</span></div><div class="sub">'+(d.litres!=null?d.litres:0)+' L \u00b7 Sales '+inr((d.sales||0)+(d.lube||0))+' \u00b7 Collected '+inr(d.collected||0)+' \u00b7 <span style="font-weight:700;color:'+dfCol+'">'+dfText+'</span></div></div>';
  });
  document.getElementById("app").innerHTML=h;
}
var WORKER_ASSIGN_DATA=null;
function loadWAssign(){
  tab="wassign";
  document.getElementById("app").innerHTML=ubar()+wnav()+'<div class="empty">Loading assignment details...</div>';
  api("GET","/api/worker/assign-info").then(function(r){
    if(tab!="wassign")return;
    WORKER_ASSIGN_DATA=r;
    renderWAssign(r);
  }).catch(function(e){
    console.error("loadWAssign error:", e);
    document.getElementById("app").innerHTML=ubar()+wnav()+'<div class="empty">Could not load. '+esc((e&&e.error)||(e&&e.message)||"Check connection.")+'<div style="margin-top:14px"><button onclick="loadWAssign()">Try again</button></div></div>';
  });
}
function renderWAssign(r){
  if(r)WORKER_ASSIGN_DATA=r;
  else r=WORKER_ASSIGN_DATA;
  if(!r)return;

  var h=ubar()+wnav()+'<button class="ghost noprint" onclick="tab=\'wduty\';loadW()" style="margin-bottom:12px">← Back to My duty</button><h1>🤝 Handover duty</h1>';
  if(r.has_open){
    h+='<div class="cust" style="cursor:default;padding:14px">'
      +'<div class="row"><b style="color:var(--ok)">Active duty in progress</b><span class="sub" style="flex:none">'+esc(r.duty.shift)+' · '+esc(r.duty.d)+'</span></div>'
      +'<div class="sub" style="margin-top:6px">You already have an open duty in progress. Complete and submit it before handing over the next shift.</div>'
      +'<div class="btns" style="margin:12px 0 0"><button onclick="tab=\'wduty\';loadW()">Go to active duty</button></div>'
      +'</div>';
    document.getElementById("app").innerHTML=h;
    return;
  }
  if(!r.latest_closed){
    h+='<div class="empty">No closed duty found to hand over from. Once a shift is completed and closed, you can hand over future shifts here.</div>';
    document.getElementById("app").innerHTML=h;
    return;
  }
  var lc=r.latest_closed;
  var nextShift="Morning";
  if(lc.shift=="Morning")nextShift="Evening";
  else if(lc.shift=="Evening")nextShift="Night";
  else if(lc.shift=="Night")nextShift="Morning";

  h+='<div class="sub" style="margin-bottom:12px">Hand over duty and starting nozzle readings to an incoming colleague for the next shift.</div>';

  h+='<div class="cust" style="cursor:default;margin-bottom:14px;padding:12px">'
    +'<div class="row"><b>Previous duty ('+esc(lc.shift)+')</b><span class="sub" style="flex:none;color:var(--ok)"><b>'+(lc.status=="closed"?"Closed ✓":"Submitted ✓")+'</b></span></div>'
    +'<div class="sub" style="margin-top:4px">Completed by: <b>'+esc(ME?ME.name:"Worker")+'</b> · Business date: <b>'+esc(lc.d)+'</b></div>'
    +'</div>';

  var myId=(ME&&ME.id)?ME.id:null;
  var cList=(r.colleagues||[]).filter(function(w){return w.role==='worker'});
  var otherColleagues=cList.filter(function(w){return w.id!=myId});
  var defaultTargetId=otherColleagues.length?otherColleagues[0].id:(cList[0]?cList[0].id:"");

  if(!cList.length){
    h+='<div class="cust" style="background:#fff3cd;border-color:#ffeeba;color:#856404;padding:10px 12px;margin-bottom:12px">⚠️ No active workers are registered. Add workers in the Team tab to hand over duty.</div>';
  }else{
    h+='<label>Incoming worker (handover duty to)<select id="wa_target_worker">'
      +cList.map(function(w){
        var isSelf=(w.id==myId);
        var selfTag=isSelf?' (You)':'';
        var busyTag=w.busy?' - currently on duty':'';
        var isSel=(w.id==defaultTargetId);
        return '<option value="'+w.id+'"'+(isSel?' selected':'')+'>'+esc(w.name)+selfTag+busyTag+'</option>';
      }).join("")
      +'</select></label>';
  }

  h+='<label>Shift for incoming worker<select id="wa_shift">'
    +(r.shifts||["Morning","Evening","Night"]).map(function(s){return '<option value="'+s+'"'+(s==nextShift?' selected':'')+'>'+s+' shift</option>'}).join("")
    +'</select></label>';

  h+='<label>Business day<input value="'+r.date+' ('+(r.day=="open"?"Open":"Closed")+')" disabled style="background:var(--bg)"></label>';

  h+='<label>Handover note (optional)<input id="wa_note" placeholder="e.g. Cash till checked, dip taken, notes for incoming worker"></label>';

  h+='<div class="sub" style="font-weight:700;color:var(--ink);margin:16px 0 6px">Nozzle readings from closed duty ('+(r.nozzles?r.nozzles.length:0)+' nozzles)</div>';
  h+='<div class="tbl"><table><tr><th>Nozzle & Fuel</th><th class="r">Starting opening</th><th class="r">Rate</th></tr>';
  (r.nozzles||[]).forEach(function(n){
    var busyNote=n.busy_by?'<div class="sub" style="color:var(--due)">Busy with '+esc(n.busy_by)+'</div>':'';
    h+='<tr>';
    h+='<td><b>'+esc(n.name)+'</b> <span class="sub">('+esc(n.fuel)+')</span>'+busyNote+'</td>';
    h+='<td class="r"><b>'+(n.opening!=null?Number(n.opening).toFixed(2):'-')+'</b></td>';
    h+='<td class="r">'+(n.rate!=null?(m2(n.rate)+'/L'):'-')+'</td>';
    h+='</tr>';
  });
  h+='</table></div>';

  if(r.day!="open"){
    h+='<div class="cust" style="background:#fff3cd;border-color:#ffeeba;color:#856404;margin-top:12px;padding:10px 12px;cursor:default">'
      +'⚠️ Today\'s business day ('+r.date+') is closed. Ask your owner/manager to open it.'
      +'</div>';
  }

  var noColleagues=(!cList||!cList.length);
  var btnDisabled=(r.day!="open")||noColleagues;

  h+='<div class="err" id="waErr" style="margin-top:8px"></div>'
    +'<div class="btns" style="margin-top:16px">'
    +'<button id="btnDoAssign" style="width:100%" '+(btnDisabled?'disabled ':'')+'onclick="doWorkerAssign()">'
    +'🤝 Confirm handover & assign duty'
    +'</button>'
    +'</div>';

  document.getElementById("app").innerHTML=h;
}
function doWorkerAssign(){
  var btn=document.getElementById("btnDoAssign");
  var errDiv=document.getElementById("waErr");
  var note=v("wa_note");
  var shift=v("wa_shift");
  var singleTargetId=v("wa_target_worker");

  if(!singleTargetId){
    if(errDiv)errDiv.textContent="Please select an incoming staff member.";
    return;
  }

  if(btn){
    btn.disabled=true;
    btn.textContent="Handing over duty...";
  }

  var payload={
    shift:shift,
    target_worker_id:+singleTargetId,
    note:note
  };

  api("POST","/api/worker/assign-duty",payload).then(function(res){
    var successMsg="Duty handed over to "+(res.target_name||"worker")+" successfully!";
    toast(successMsg);
    tab="wduty";
    loadW();
  }).catch(function(e){
    if(btn){
      btn.disabled=false;
      btn.textContent="🤝 Confirm handover & assign duty";
    }
    if(errDiv)errDiv.textContent=e.error||"Could not complete handover. Check your connection.";
    else toast(e.error||"Could not complete handover.");
  });
}

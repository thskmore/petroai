// ---- Handover History Tab
var HO_SEARCH = "";
var HO_STAFF = "all";
var HO_SHIFT = "all";
var HO_RANGE = "all";
var HO_DATA = null;
var HO_LOADING = false;

function loadHandoverHistory(cb){
  HO_LOADING = true;
  var params = [];
  if (HO_STAFF && HO_STAFF !== "all") params.push("worker_id=" + encodeURIComponent(HO_STAFF));
  if (HO_SHIFT && HO_SHIFT !== "all") params.push("shift=" + encodeURIComponent(HO_SHIFT));
  if (HO_SEARCH && HO_SEARCH.trim()) params.push("search=" + encodeURIComponent(HO_SEARCH.trim()));

  if (HO_RANGE === "today") {
    var td = bizToday();
    params.push("date_from=" + td);
    params.push("date_to=" + td);
  } else if (HO_RANGE === "7d") {
    var d7 = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
    params.push("date_from=" + d7);
  } else if (HO_RANGE === "30d") {
    var d30 = new Date(Date.now() - 30 * 864e5).toISOString().slice(0, 10);
    params.push("date_from=" + d30);
  }

  var qs = params.length ? ("?" + params.join("&")) : "";
  api("GET", "/api/handover-history" + qs).then(function(res){
    HO_DATA = res;
    HO_LOADING = false;
    if (tab === "handover") renderHandover();
    if (cb) cb();
  }).catch(function(e){
    HO_LOADING = false;
    toast(e.error || "Could not load handover history.");
    if (tab === "handover") renderHandover();
    if (cb) cb();
  });
}

function setHandoverRange(rg){
  HO_RANGE = rg;
  loadHandoverHistory();
}

function resetHandoverFilters(){
  HO_SEARCH = "";
  HO_STAFF = "all";
  HO_SHIFT = "all";
  HO_RANGE = "all";
  var si = document.getElementById("ho_search");
  if (si) si.value = "";
  var ss = document.getElementById("ho_staff");
  if (ss) ss.value = "all";
  var sh = document.getElementById("ho_shift");
  if (sh) sh.value = "all";
  loadHandoverHistory();
}

function filterHandoverItems(items){
  if (!HO_SEARCH || !HO_SEARCH.trim()) return items;
  var q = HO_SEARCH.trim().toLowerCase();
  return items.filter(function(x){
    var sName = (x.sender && x.sender.name ? x.sender.name : "").toLowerCase();
    var rName = (x.receiver && x.receiver.name ? x.receiver.name : "").toLowerCase();
    var note = (x.note || "").toLowerCase();
    var nz = (x.nozzles || "").toLowerCase();
    var d = (x.d || "").toLowerCase();
    var shift = (x.shift || "").toLowerCase();
    return sName.indexOf(q) > -1 || rName.indexOf(q) > -1 || note.indexOf(q) > -1 || nz.indexOf(q) > -1 || d.indexOf(q) > -1 || shift.indexOf(q) > -1;
  });
}

function applyHandoverFilter(){
  var feed = document.getElementById("ho_feed");
  if (!feed || !HO_DATA) return;
  var filtered = filterHandoverItems(HO_DATA.handovers || []);
  if (!filtered.length) {
    feed.innerHTML = '<div class="empty" style="padding:36px 16px"><div style="font-size:28px;margin-bottom:8px">📋</div><b>No handovers matched your search.</b><div class="sub" style="margin-top:4px">No records match "' + esc(HO_SEARCH) + '".</div><button class="ghost" style="margin-top:12px" onclick="resetHandoverFilters()">Reset filters</button></div>';
  } else {
    var h = '<div style="margin-bottom:8px;font-size:12px;font-weight:700;color:var(--mute)">Showing ' + filtered.length + ' handover record' + (filtered.length > 1 ? 's' : '') + ':</div>';
    filtered.forEach(function(item){
      h += renderHandoverCard(item);
    });
    feed.innerHTML = h;
  }
}

function renderHandover(){
  tab = "handover";
  var A = document.getElementById("app");
  if (!A) return;

  if (!SRV) {
    A.innerHTML = nav() + '<div class="empty">Handover history is stored on the server. Please log in to view past shifts.</div>';
    return;
  }

  if (!HO_DATA && !HO_LOADING) {
    A.innerHTML = nav() + '<div class="empty">Loading handover history…</div>';
    loadHandoverHistory();
    return;
  }

  var h = nav();
  h += '<div class="row" style="align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px">';
  h += '<div><h1 style="margin:0">🤝 Handover History</h1><div class="sub" style="margin-top:2px">Chronological audit log of all shift duties transferred between station staff, with notes and nozzle readings.</div></div>';
  h += '<div class="btns" style="margin:0;flex:none">';
  if (ME && ME.role === "worker") {
    h += '<button onclick="tab=\'wassign\';loadWAssign()" style="display:inline-flex;align-items:center;gap:6px">🤝 Handover Duty</button>';
  } else {
    h += '<button onclick="assignForm()" style="display:inline-flex;align-items:center;gap:6px">Assign Duty</button>';
    h += '<button class="ghost" onclick="quickHandoverModal()" style="display:inline-flex;align-items:center;gap:6px">+ Log Transfer Note</button>';
  }
  h += '<button class="ghost" onclick="loadHandoverHistory()" title="Refresh records" style="padding:8px 12px">🔄</button>';
  h += '</div></div>';

  var data = HO_DATA || { handovers: [], stats: { total: 0, today: 0, with_notes: 0, staff_count: 0 }, staff: [] };
  var stats = data.stats || {};
  var allItems = data.handovers || [];
  var staffList = data.staff || [];

  // Top KPI metrics bar
  h += '<div class="ho-kpi-bar noprint">';
  h += '<div class="ho-kpi-card"><div class="ho-kpi-num">' + (stats.total || allItems.length) + '</div><div class="ho-kpi-lbl">Total Handovers</div></div>';
  h += '<div class="ho-kpi-card"><div class="ho-kpi-num" style="color:var(--ok)">' + (stats.today || 0) + '</div><div class="ho-kpi-lbl">Today\'s Transfers</div></div>';
  h += '<div class="ho-kpi-card"><div class="ho-kpi-num" style="color:var(--btn)">' + (stats.with_notes || allItems.filter(function(x){return x.note;}).length) + '</div><div class="ho-kpi-lbl">With Notes</div></div>';
  h += '<div class="ho-kpi-card"><div class="ho-kpi-num">' + (stats.staff_count || staffList.length || 5) + '</div><div class="ho-kpi-lbl">Active Staff</div></div>';
  h += '</div>';

  // Filter Bar
  h += '<div class="ho-filters noprint">';
  h += '<div class="ho-filter-row">';
  h += '<div class="ho-search-wrap">';
  h += '<span class="ho-search-icon">🔍</span>';
  h += '<input id="ho_search" type="text" placeholder="Search sender, receiver, note, nozzle..." value="' + esc(HO_SEARCH) + '" oninput="HO_SEARCH=this.value;applyHandoverFilter()">';
  h += '</div>';
  h += '<select id="ho_staff" style="margin:0;min-width:160px" onchange="HO_STAFF=this.value;loadHandoverHistory()">';
  h += '<option value="all">👥 All Staff Members</option>';
  staffList.forEach(function(u){
    var sel = (HO_STAFF == u.id) ? ' selected' : '';
    h += '<option value="' + u.id + '"' + sel + '>' + esc(u.name) + ' (' + esc(u.role) + ')</option>';
  });
  h += '</select>';
  h += '<select id="ho_shift" style="margin:0;min-width:130px" onchange="HO_SHIFT=this.value;loadHandoverHistory()">';
  h += '<option value="all">⏱ All Shifts</option>';
  h += '<option value="Morning"' + (HO_SHIFT=="Morning"?' selected':'') + '>Morning</option>';
  h += '<option value="Evening"' + (HO_SHIFT=="Evening"?' selected':'') + '>Evening</option>';
  h += '<option value="Night"' + (HO_SHIFT=="Night"?' selected':'') + '>Night</option>';
  h += '</select>';
  h += '</div>';

  // Quick Date Range Filter
  h += '<div class="row" style="align-items:center;gap:6px;font-size:12px;margin:0">';
  h += '<span style="font-weight:700;color:var(--mute)">Time range:</span>';
  var ranges = [["all","All Time"],["today","Today"],["7d","Last 7 Days"],["30d","Last 30 Days"]];
  ranges.forEach(function(rg){
    var active = (HO_RANGE === rg[0]);
    h += '<button type="button" class="' + (active?'':'ghost') + '" style="padding:4px 10px;font-size:12px;border-radius:14px" onclick="setHandoverRange(\''+rg[0]+'\')">' + rg[1] + '</button>';
  });
  if (HO_SEARCH || HO_STAFF !== "all" || HO_SHIFT !== "all" || HO_RANGE !== "all") {
    h += '<button type="button" class="ghost" style="padding:4px 10px;font-size:12px;color:var(--due);margin-left:auto" onclick="resetHandoverFilters()">Clear filters</button>';
  }
  h += '</div>';
  h += '</div>';

  // Items Feed
  var filtered = filterHandoverItems(allItems);
  h += '<div id="ho_feed">';
  if (!filtered.length) {
    h += '<div class="empty" style="padding:36px 16px"><div style="font-size:28px;margin-bottom:8px">📋</div><b>No handovers matched your filters.</b><div class="sub" style="margin-top:4px">Try clearing search terms or selecting a different staff member.</div><button class="ghost" style="margin-top:12px" onclick="resetHandoverFilters()">Reset all filters</button></div>';
  } else {
    h += '<div style="margin-bottom:8px;font-size:12px;font-weight:700;color:var(--mute)">Showing ' + filtered.length + ' handover record' + (filtered.length > 1 ? 's' : '') + ':</div>';
    filtered.forEach(function(item){
      h += renderHandoverCard(item);
    });
  }
  h += '</div>';

  A.innerHTML = h;
}

function renderHandoverCard(item){
  var sender = item.sender || { name: "Sender", role: "staff" };
  var receiver = item.receiver || { name: "Receiver", role: "staff" };
  var shiftCls = item.shift === "Morning" ? "shift-morning" : (item.shift === "Evening" ? "shift-evening" : "shift-night");
  var shiftIcon = item.shift === "Morning" ? "🌅" : (item.shift === "Evening" ? "🌇" : "🌙");

  var formattedDate = item.d;
  try {
    var dt = new Date(item.d + "T00:00:00");
    formattedDate = dt.toLocaleDateString("en-IN", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
  } catch (_) {}

  var h = '<div class="ho-item">';
  h += '<div class="ho-item-top">';
  h += '<div class="ho-item-date">';
  h += '<span class="ho-item-shift ' + shiftCls + '">' + shiftIcon + ' ' + esc(item.shift) + ' Shift</span>';
  h += '<span>' + esc(formattedDate) + '</span>';
  h += '</div>';
  if (item.duty_id) {
    h += '<div style="display:flex;align-items:center;gap:6px;font-size:11px;color:var(--mute);font-weight:600">';
    h += '<span>Duty #' + item.duty_id + (item.duty_status ? ' • <span style="text-transform:capitalize">' + esc(item.duty_status) + '</span>' : '') + '</span>';
    h += '<button class="ghost noprint" style="padding:2px 8px;font-size:11px;display:inline-flex;align-items:center;gap:4px" onclick="downloadDutyPDF(' + item.duty_id + ')">📄 PDF</button>';
    h += '</div>';
  }
  h += '</div>';

  // Transfer flow: Sender -> Receiver
  h += '<div class="ho-transfer-flow">';
  // Sender
  h += '<div class="ho-party">';
  h += '<div class="ho-avatar avatar-sender">' + esc(sender.name.charAt(0).toUpperCase()) + '</div>';
  h += '<div>';
  h += '<div class="ho-party-role">Sender (Transferor)</div>';
  h += '<div class="ho-party-name">' + esc(sender.name) + '</div>';
  h += '<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,0.06);font-weight:600;text-transform:capitalize">' + esc(sender.role) + '</span>';
  h += '</div>';
  h += '</div>';

  // Arrow
  h += '<div class="ho-arrow">';
  h += '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"></line><polyline points="12 5 19 12 12 19"></polyline></svg>';
  h += '</div>';

  // Receiver
  h += '<div class="ho-party">';
  h += '<div class="ho-avatar avatar-receiver">' + esc(receiver.name.charAt(0).toUpperCase()) + '</div>';
  h += '<div>';
  h += '<div class="ho-party-role">Receiver (Incoming)</div>';
  h += '<div class="ho-party-name">' + esc(receiver.name) + '</div>';
  h += '<span style="font-size:10px;padding:1px 5px;border-radius:4px;background:rgba(0,0,0,0.06);font-weight:600;text-transform:capitalize">' + esc(receiver.role) + '</span>';
  h += '</div>';
  h += '</div>';
  h += '</div>';

  // Transfer Notes Box
  if (item.note && item.note.trim()) {
    h += '<div class="ho-note-box">';
    h += '<span class="ho-note-quote">💬 Transfer Notes:</span> ';
    h += '<span>' + esc(item.note) + '</span>';
    h += '</div>';
  } else {
    h += '<div class="ho-no-note">— No special handover instructions noted —</div>';
  }

  // Meta row: Nozzles & Action
  h += '<div class="ho-meta-row">';
  h += '<div class="ho-nozzles">';
  h += '<span style="font-weight:700;color:var(--ink)">⛽ Nozzles:</span>';
  if (item.nozzles && item.nozzles.trim()) {
    var nzList = item.nozzles.split(",").map(function(s){return s.trim()}).filter(Boolean);
    nzList.forEach(function(nz){
      h += '<span class="ho-nozzle-badge">' + esc(nz) + '</span>';
    });
  } else {
    h += '<span class="sub">Standard shift allocation</span>';
  }
  h += '</div>';

  if (item.duty_id) {
    h += '<div>';
    if (ME && (ME.role === "owner" || ME.role === "manager")) {
      h += '<button class="ghost" style="padding:4px 8px;font-size:12px" onclick="reviewDuty(' + item.duty_id + ')">Open Duty Record</button>';
    } else {
      h += '<button class="ghost" style="padding:4px 8px;font-size:12px" onclick="viewMyDuty(' + item.duty_id + ')">View Duty</button>';
    }
    h += '</div>';
  }
  h += '</div>';

  h += '</div>';
  return h;
}

function quickHandoverModal(){
  var staffList = (HO_DATA && HO_DATA.staff) ? HO_DATA.staff : [];
  var myId = (ME && ME.id) ? ME.id : null;
  var otherStaff = staffList.filter(function(u){return u.id != myId});
  if (!otherStaff.length) otherStaff = staffList;

  var h = '<h2>+ Log Duty Transfer Note</h2>'
    + '<div class="sub">Record a formal duty handover note between staff members.</div>'
    + '<label style="margin-top:12px">Incoming staff (Receiver)'
    + '<select id="qho_receiver">'
    + otherStaff.map(function(u){ return '<option value="' + u.id + '">' + esc(u.name) + ' (' + esc(u.role) + ')</option>'; }).join("")
    + '</select></label>'
    + '<label>Shift<select id="qho_shift"><option>Morning</option><option>Evening</option><option>Night</option></select></label>'
    + '<label>Date<input type="date" id="qho_date" value="' + bizToday() + '"></label>'
    + '<label>Nozzles (optional)<input id="qho_nozzles" placeholder="e.g. N1 HSD, N2 HSD, N6 Petrol" value="N1 HSD, N2 HSD"></label>'
    + '<label>Handover Notes / Instructions'
    + '<textarea id="qho_note" placeholder="e.g. Cash till counted and tallied, dip measurement recorded, POS charged, no discrepancies." style="width:100%;height:80px;margin-top:6px;padding:8px;border:1px solid var(--line);border-radius:8px;font-family:inherit;font-size:14px"></textarea>'
    + '</label>'
    + '<div class="err" id="qho_err" style="margin-top:6px"></div>'
    + '<div class="btns" style="margin-top:14px;display:flex;gap:8px">'
    + '<button class="ghost" onclick="close()">Cancel</button>'
    + '<button style="flex:1" onclick="submitQuickHandover()">Save Handover Note</button>'
    + '</div>';
  openM(h);
}

function submitQuickHandover(){
  var recId = v("qho_receiver");
  var shift = v("qho_shift");
  var d = v("qho_date");
  var nozzles = v("qho_nozzles");
  var note = (document.getElementById("qho_note")||{}).value;
  var errEl = document.getElementById("qho_err");

  if (!recId) {
    if (errEl) errEl.textContent = "Please select incoming staff member.";
    return;
  }
  if (!note || !note.trim()) {
    if (errEl) errEl.textContent = "Please enter a handover note or instruction.";
    return;
  }

  api("POST", "/api/handover-history", {
    receiver_id: recId,
    shift: shift,
    d: d,
    nozzles: nozzles,
    note: note
  }).then(function(){
    close();
    toast("Handover note logged successfully!");
    loadHandoverHistory();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not save handover note.";
    else toast(e.error || "Could not save.");
  });
}

function autoFillDensityRef(){
  var tankEl = document.getElementById("mden_tank");
  if (!tankEl) return;
  var opt = tankEl.options[tankEl.selectedIndex];
  var fuel = opt ? opt.getAttribute("data-fuel") : "";
  var refEl = document.getElementById("mden_ref");
  if (!refEl) return;
  if (fuel.indexOf("Diesel") > -1 || fuel.indexOf("HSD") > -1) {
    refEl.value = "829.4";
  } else if (fuel.indexOf("Power") > -1) {
    refEl.value = "744.1";
  } else {
    refEl.value = "742.5";
  }
  calcLiveDensity();
}

function calcLiveDensity(){
  var temp = parseFloat((document.getElementById("mden_temp")||{}).value);
  var obs = parseFloat((document.getElementById("mden_obs")||{}).value);
  var ref = parseFloat((document.getElementById("mden_ref")||{}).value);
  var tankEl = document.getElementById("mden_tank");
  var opt = tankEl ? tankEl.options[tankEl.selectedIndex] : null;
  var fuel = opt ? opt.getAttribute("data-fuel") : "";

  if (isNaN(temp) || isNaN(obs) || isNaN(ref)) return;

  var isDiesel = fuel.indexOf("Diesel") > -1 || fuel.indexOf("HSD") > -1;
  var factor = isDiesel ? 0.67 : 0.70;
  var converted = Math.round((obs + (temp - 15) * factor) * 10) / 10;
  var diff = Math.round((converted - ref) * 10) / 10;
  var isPass = Math.abs(diff) <= 3.0;

  var convEl = document.getElementById("mden_conv_val");
  var diffEl = document.getElementById("mden_diff_val");
  var statEl = document.getElementById("mden_status_val");

  if (convEl) convEl.textContent = converted + " kg/m³";
  if (diffEl) {
    diffEl.textContent = (diff > 0 ? "+" : "") + diff + " kg/m³";
    diffEl.style.color = isPass ? "var(--ok)" : "var(--due)";
  }
  if (statEl) {
    statEl.innerHTML = isPass
      ? '<span style="color:var(--ok)">✅ Strictly within permissible limit (±3.0 kg/m³) - PASSED</span>'
      : '<span style="color:var(--due)">⚠️ EXCEEDS PERMISSIBLE LIMIT (Diff: ' + diff + ' kg/m³) - INVESTIGATE</span>';
  }
}

  var invDens = parseFloat((document.getElementById("dec_inv_dens")||{}).value);
  var invQty = parseFloat((document.getElementById("dec_inv_qty")||{}).value);
  var bQty = parseFloat((document.getElementById("dec_b_qty")||{}).value);
  var aQty = parseFloat((document.getElementById("dec_a_qty")||{}).value);

  var tankEl = document.getElementById("dec_tank");
  var opt = tankEl ? tankEl.options[tankEl.selectedIndex] : null;
  var fuel = opt ? opt.getAttribute("data-fuel") : "Diesel (HSD)";

  var isDiesel = fuel.indexOf("Diesel") > -1 || fuel.indexOf("HSD") > -1;
  var factor = isDiesel ? 0.67 : 0.70;

  var convTxt = document.getElementById("dec_conv_txt");
  var diffTxt = document.getElementById("dec_diff_txt");

  if (!isNaN(temp) && !isNaN(obs)) {
    var conv = Math.round((obs + (temp - 15) * factor) * 10) / 10;
    if (convTxt) convTxt.textContent = conv + " kg/m³";
    if (!isNaN(invDens)) {
      var diff = Math.round((conv - invDens) * 10) / 10;
      var ok = Math.abs(diff) <= 3.0;
      if (diffTxt) {
        diffTxt.textContent = (diff > 0 ? "+" : "") + diff + " kg/m³ (" + (ok ? "Within ±3.0 limit" : "Out of tolerance") + ")";
        diffTxt.style.color = ok ? "var(--ok)" : "var(--due)";
      }
    }
  }
}

function submitTankerDecant(){
  var challan = v("dec_challan");
  var tanker = v("dec_tanker");
  var oil = v("dec_oil");
  var transporter = v("dec_transporter");
  var tankId = v("dec_tank");
  var tankEl = document.getElementById("dec_tank");
  var opt = tankEl ? tankEl.options[tankEl.selectedIndex] : null;
  var fuel = opt ? opt.getAttribute("data-fuel") : "Diesel (HSD)";
  var invQty = v("dec_inv_qty");
  var invDens = v("dec_inv_dens");
  var obsTemp = v("dec_obs_temp");
  var obsDens = v("dec_obs_dens");
  var waterOk = document.getElementById("dec_water_ok") ? document.getElementById("dec_water_ok").checked : true;
  var bDip = v("dec_b_dip");
  var bQty = v("dec_b_qty");
  var aDip = v("dec_a_dip");
  var aQty = v("dec_a_qty");
  var driver = v("dec_driver");
  var d = v("dec_date");
  var notes = v("dec_notes");
  var errEl = document.getElementById("dec_err");

  if (!challan || !tanker || !invQty || !invDens || !obsDens) {
    if (errEl) errEl.textContent = "Please fill in challan #, tanker #, invoice quantity, and density readings.";
    return;
  }

  api("POST", "/api/tanker-decantation", {
    challan_no: challan,
    tanker_no: tanker,
    transporter: transporter,
    oil_company: oil,
    d: d,
    fuel_type: fuel,
    tank_id: tankId,
    invoice_qty: parseFloat(invQty),
    invoice_density: parseFloat(invDens),
    observed_temp: parseFloat(obsTemp),
    observed_density: parseFloat(obsDens),
    water_paste_ok: waterOk ? 1 : 0,
    before_dip_cm: bDip ? parseFloat(bDip) : null,
    before_qty: bQty ? parseFloat(bQty) : null,
    after_dip_cm: aDip ? parseFloat(aDip) : null,
    after_qty: aQty ? parseFloat(aQty) : null,
    driver_name: driver,
    notes: notes
  }).then(function(){
    close();
    toast("Tanker decantation saved successfully!");
    loadDensityData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not save tanker decantation.";
  });
}

  var customers = (INDENTS_DATA && INDENTS_DATA.customers) ? INDENTS_DATA.customers : [];
  var c = customers.find(function(x){ return String(x.id) === String(cid); });
  var infoEl = document.getElementById("iss_credit_info");
  if (!infoEl) return;
  if (!c) { infoEl.innerHTML = ""; return; }

  var cDue = due(c);
  var cLimit = c.limit || 0;
  var avail = Math.max(0, cLimit - cDue);
  infoEl.innerHTML = 'Credit Limit: <b>' + inr(cLimit) + '</b> &nbsp;|&nbsp; Current Due: <b>' + inr(cDue) + '</b> &nbsp;|&nbsp; Available Headroom: <b style="color:' + (avail < 5000 ? 'var(--warn)' : 'var(--ok)') + '">' + inr(avail) + '</b>';
}

function submitIssueIndent(){
  var cid = v("iss_cust");
  var veh = v("iss_veh");
  var leaf = v("iss_leaf");
  var driver = v("iss_driver");
  var mobile = v("iss_mobile");
  var odom = v("iss_odometer");
  var fuel = v("iss_fuel");
  var qty = v("iss_qty");
  var amt = v("iss_amt");
  var note = v("iss_note");
  var errEl = document.getElementById("iss_err");

  if (!cid || !veh) {
    if (errEl) errEl.textContent = "Please select customer and enter vehicle number.";

  }

  api("POST", "/api/fleet-indents/issue", {
    cust_id: cid,
    vehicle_no: veh,
    slip_leaf_no: leaf,
    driver_name: driver,
    driver_mobile: mobile,
    fuel_product: fuel,
    req_qty: qty ? parseFloat(qty) : null,
    req_amount: amt ? parseFloat(amt) : null,

  }).then(function(res){

function calcDispenseTotal(){
  var q = parseFloat((document.getElementById("dsp_qty")||{}).value) || 0;
  var r = parseFloat((document.getElementById("dsp_rate")||{}).value) || 0;
  var tot = Math.round(q * r * 100) / 100;
  var txtEl = document.getElementById("dsp_total_txt");
  if (txtEl) txtEl.textContent = inr(tot);
}

function submitDispenseIndent(indentId){

function adjustLubeQty(delta){
  var qEl = document.getElementById("qls_qty");
  if (!qEl) return;
  var cur = parseInt(qEl.value) || 1;
  var next = Math.max(1, cur + delta);
  qEl.value = next;
  updateLubeSaleCalc();
}

function updateLubeSaleCalc(){
  var itemEl = document.getElementById("qls_item");
  if (!itemEl) return;
  var opt = itemEl.options[itemEl.selectedIndex];
  if (!opt) return;
  var price = parseFloat(opt.getAttribute("data-price")) || 0;
  var inc = parseFloat(opt.getAttribute("data-inc")) || 0;
  var qty = parseInt((document.getElementById("qls_qty")||{}).value) || 1;

  var tot = price * qty;
  var totInc = inc * qty;

  var totEl = document.getElementById("qls_total_txt");
  var incEl = document.getElementById("qls_inc_txt");
  if (totEl) totEl.textContent = inr(tot);
  if (incEl) incEl.textContent = "Driveway Staff Incentive: +₹" + totInc;
}

var CALIB_DATA = null;
var CALIB_LOADING = false;
var CALIB_SUBTAB = "daily"; // "daily" or "certs"
var CALIB_NOZZLE = "all";

function loadCalibrationData(){
  CALIB_LOADING = true;
  api("GET", "/api/calibration-log?nozzle_id=" + encodeURIComponent(CALIB_NOZZLE))
    .then(function(res){
      CALIB_DATA = res;
      CALIB_LOADING = false;
      if (tab === "calibration") renderCalibrationTab();
    })
    .catch(function(err){
      CALIB_LOADING = false;
      toast(err.error || "Could not load calibration data.");
      if (tab === "calibration") renderCalibrationTab();
    });
}

function renderCalibrationTab(){
  tab = "calibration";
  var A = document.getElementById("app");
  if (!A) return;

  if (!SRV) {
    A.innerHTML = nav() + '<div class="empty">Calibration register is stored on the server. Please log in.</div>';
    return;
  }

  if (!CALIB_DATA && !CALIB_LOADING) {
    A.innerHTML = nav() + '<div class="empty">Loading 5L calibration log…</div>';
    loadCalibrationData();
    return;
  }

  var data = CALIB_DATA || { calibrations: [], nozzles: [], certificates: [], tanks: [], stats: {} };
  var calibs = data.calibrations || [];
  var nozzles = data.nozzles || [];
  var certs = data.certificates || [];
  var stats = data.stats || {};

  var h = nav();

  // Header
  h += '<div class="row" style="align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px">';
  h += '<div><h1 style="margin:0">⚖️ Daily 5L Calibration & Stamping Log</h1><div class="sub" style="margin-top:2px">Statutory Legal Metrology Department 5-Litre conical measure inspection register and dispenser accuracy audit.</div></div>';
  h += '<div class="btns" style="margin:0;flex:none">';
  h += '<button onclick="openRun5LCalibrationModal()" style="display:inline-flex;align-items:center;gap:6px">✅ Run Morning 5L Test</button>';
  if (ME && (ME.role === "owner" || ME.role === "manager")) {
    h += '<button onclick="openAddCertificateModal()" class="ghost" style="display:inline-flex;align-items:center;gap:6px">📜 Add Certificate</button>';
  }
  h += '<button class="ghost" onclick="loadCalibrationData()" title="Refresh" style="padding:8px 12px">🔄</button>';
  h += '</div></div>';

  // Nozzle Readiness Banner
  var testedCount = stats.tested_today_count || 0;
  var totalNozzles = stats.total_active_nozzles || nozzles.length || 6;
  var allTested = testedCount >= totalNozzles && totalNozzles > 0;

  h += '<div style="background:' + (allTested ? 'rgba(11,122,95,0.08)' : 'rgba(217,119,6,0.08)') + ';border:1px solid ' + (allTested ? 'rgba(11,122,95,0.3)' : 'rgba(217,119,6,0.3)') + ';border-radius:12px;padding:12px 16px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px">';
  h += '<div style="display:flex;align-items:center;gap:10px">';
  h += '<span style="font-size:24px">' + (allTested ? '🛡️' : '⏳') + '</span>';
  h += '<div>';
  h += '<div style="font-weight:800;font-size:14.5px;color:var(--ink)">' + (allTested ? 'Morning Dispenser Inspection Complete (' + testedCount + '/' + totalNozzles + ' Nozzles Tested)' : 'Pending Morning Verification: ' + testedCount + ' of ' + totalNozzles + ' Active Nozzles Tested Today') + '</div>';
  h += '<div class="sub" style="font-size:12px">Statutory Legal Metrology rule: 5L conical measure test mandatory before opening shift sales. Permissible tolerance: ±25 ml (±0.5%).</div>';
  h += '</div></div>';
  if (!allTested) {
    h += '<button onclick="openRun5LCalibrationModal()" style="padding:7px 14px;font-size:13px">Test Remaining Nozzles</button>';
  }
  h += '</div>';

  // KPI Metrics
  h += '<div class="ops-kpi-bar noprint">';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num" style="color:' + (allTested ? 'var(--ok)' : 'var(--warn)') + '">' + testedCount + ' / ' + totalNozzles + '</div><div class="ops-kpi-lbl">Nozzles Tested Today</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num" style="color:var(--btn)">' + (stats.overall_pass_rate || 100) + '%</div><div class="ops-kpi-lbl">Calibration Pass Rate</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num">±25 ml</div><div class="ops-kpi-lbl">Legal Metrology Tolerance</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num">' + certs.length + '</div><div class="ops-kpi-lbl">Stamped Measures & Certs</div></div>';
  h += '</div>';

  // Subtabs Switcher
  h += '<div class="ops-subtabs noprint">';
  h += '<button class="ops-subtab-btn ' + (CALIB_SUBTAB === "daily" ? 'active' : '') + '" onclick="CALIB_SUBTAB=\'daily\';renderCalibrationTab()">📅 Daily 5L Inspection Log (' + calibs.length + ')</button>';
  h += '<button class="ops-subtab-btn ' + (CALIB_SUBTAB === "certs" ? 'active' : '') + '" onclick="CALIB_SUBTAB=\'certs\';renderCalibrationTab()">📜 Legal Metrology Stamping Certificates (' + certs.length + ')</button>';
  h += '</div>';

  if (CALIB_SUBTAB === "daily") {
    if (!calibs.length) {
      h += '<div class="empty">No calibration records found. Tap "✅ Run Morning 5L Test" to record today\'s morning nozzle inspection.</div>';
    } else {
      h += '<div class="ops-table-wrap">';
      h += '<table class="ops-table">';
      h += '<thead><tr>';
      h += '<th>Date & Shift</th><th>Dispenser Nozzle</th><th>Standard Measure</th><th>Delivered Volume</th><th>Error / Variation</th><th>Tolerance</th><th>Status</th><th>Fuel Drain-back</th><th>Inspected By</th>';
      h += '</tr></thead><tbody>';
      calibs.forEach(function(row){
        var nozObj = nozzles.find(function(n){ return String(n.id) === String(row.nozzle_id); }) || { name: "Nozzle " + row.nozzle_id, fuel: "Fuel" };
        var errVal = Number(row.error_ml);
        var errStr = (errVal > 0 ? "+" : "") + errVal + " ml";
        var isPass = row.is_passed === 1 || Math.abs(errVal) <= 25;

        h += '<tr>';
        h += '<td style="font-weight:700;white-space:nowrap">' + row.d + '<br><span class="sub" style="font-size:11px">' + esc(row.shift) + '</span></td>';
        h += '<td><b>' + esc(nozObj.name) + '</b><br><span class="sub" style="font-size:11px">' + esc(nozObj.fuel) + '</span></td>';
        h += '<td>5,000 ml</td>';
        h += '<td style="font-weight:700">' + row.delivered_ml + ' ml</td>';
        h += '<td style="font-weight:800;color:' + (isPass ? 'var(--ok)' : 'var(--due)') + '">' + errStr + '</td>';
        h += '<td class="sub">±25 ml (0.5%)</td>';
        h += '<td><span class="ops-pill ' + (isPass ? 'ops-pill-ok' : 'ops-pill-err') + '">' + (isPass ? '✅ PASSED' : '⚠️ OUT OF NORM') + '</span></td>';
        h += '<td style="font-size:12px;color:var(--ink)">💧 5.0L poured back to tank</td>';
        h += '<td class="sub" style="font-size:12px">' + esc(row.checked_by_name || 'Staff') + '</td>';
        h += '</tr>';
      });
      h += '</tbody></table></div>';
    }
  } else {
    // Stamping Certificates
    h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
    certs.forEach(function(c){
      var expiryDate = new Date(c.expiry_date);
      var daysLeft = Math.ceil((expiryDate - new Date()) / (1000 * 60 * 60 * 24));
      var isExpiringSoon = daysLeft < 45;

      h += '<div class="ops-card">';
      h += '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:6px">';
      h += '<div style="font-weight:800;font-size:15px;color:var(--ink)">' + esc(c.equipment_name) + '</div>';
      h += '<span class="ops-pill ' + (isExpiringSoon ? 'ops-pill-warn' : 'ops-pill-ok') + '">' + (daysLeft > 0 ? daysLeft + ' days left' : 'EXPIRED') + '</span>';
      h += '</div>';

      h += '<div style="margin:10px 0;font-size:12.5px;line-height:1.6;background:var(--bg);padding:10px;border-radius:8px;border:1px solid var(--line)">';
      h += '<div>Serial #: <b>' + esc(c.serial_no) + '</b></div>';
      h += '<div>Cert #: <b>' + esc(c.cert_no) + '</b></div>';
      h += '<div>Stamping Date: <b>' + c.stamping_date + '</b></div>';
      h += '<div>Valid Till: <b style="color:' + (isExpiringSoon ? 'var(--warn)' : 'var(--ink)') + '">' + c.expiry_date + '</b></div>';
      h += '<div class="sub" style="font-size:11px;margin-top:4px">' + esc(c.inspector_name || '') + ' · ' + esc(c.department || '') + '</div>';
      h += '</div>';

      if (c.notes) {
        h += '<div class="sub" style="font-size:11.5px;font-style:italic">' + esc(c.notes) + '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
  }

  A.innerHTML = h;
}

function autoFillCalibTank(){
  var nozEl = document.getElementById("cal_nozzle");
  if (!nozEl) return;
  var opt = nozEl.options[nozEl.selectedIndex];
  var tankId = opt ? opt.getAttribute("data-tank") : "";
  var tankEl = document.getElementById("cal_tank");
  if (tankEl && tankId) tankEl.value = tankId;
}

function calcCalibDiff(){
  var del = parseFloat((document.getElementById("cal_delivered")||{}).value);
  if (isNaN(del)) return;
  var err = Math.round(del - 5000);
  var isPass = Math.abs(err) <= 25;
  var errEl = document.getElementById("cal_err_val");
  var statEl = document.getElementById("cal_stat_val");

  if (errEl) {
    errEl.textContent = (err > 0 ? "+" : "") + err + " ml (" + (err/50).toFixed(2) + "%)";
    errEl.style.color = isPass ? "var(--ok)" : "var(--due)";
  }
  if (statEl) {
    statEl.innerHTML = isPass
      ? '<span style="color:var(--ok)">✅ WITHIN LEGAL TOLERANCE (±25 ml / 0.5%) - PASSED</span>'
      : '<span style="color:var(--due)">⚠️ EXCEEDS TOLERANCE - NOZZLE REQUIRES CALIBRATION</span>';
  }
}

function submit5LCalibration(){
  var nozId = v("cal_nozzle");
  var d = v("cal_date");
  var shift = v("cal_shift");
  var del = v("cal_delivered");
  var tankId = v("cal_tank");
  var sr = v("cal_measure_sr");
  var notes = v("cal_notes");
  var errEl = document.getElementById("cal_err");

  if (!nozId || !del) {
    if (errEl) errEl.textContent = "Please select nozzle and enter delivered volume in ml.";
    return;
  }

  api("POST", "/api/calibration-log", {
    d: d,
    shift: shift,
    nozzle_id: nozId,
    measure_qty: 5000,
    delivered_ml: parseFloat(del),
    returned_to_tank_id: tankId,
    stamped_measure_sr: sr,
    notes: notes
  }).then(function(){
    close();
    toast("Nozzle calibration verified and logged!");
    loadCalibrationData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not save calibration log.";
  });
}

    + '<label>Stamping Date<input type="date" id="cert_stamp" value="' + bizToday() + '"></label>'
    + '<label>Expiry Date<input type="date" id="cert_exp"></label>'
    + '</div>'
    + '<label>Inspector Name & Division<input id="cert_insp" placeholder="e.g. S. R. Shinde (Insp. Legal Metrology, Solapur)"></label>'
    + '<label>Notes (optional)<input id="cert_notes" placeholder="e.g. Stamped at pump bay during annual inspection."></label>'
    + '<div class="err" id="cert_err"></div>'
    + '<div class="btns" style="margin-top:14px;display:flex;gap:8px">'
    + '<button class="ghost" onclick="close()">Cancel</button>'
    + '<button style="flex:1" onclick="submitCalibrationCertificate()">Save Certificate</button>'

}

function submitCalibrationCertificate(){
  var name = v("cert_name");
  var sr = v("cert_sr");
  var no = v("cert_no");
  var stamp = v("cert_stamp");
  var exp = v("cert_exp");
  var insp = v("cert_insp");
  var notes = v("cert_notes");
  var errEl = document.getElementById("cert_err");

  if (!name || !sr || !no || !stamp || !exp) {
    if (errEl) errEl.textContent = "Please fill in equipment name, serial #, certificate #, stamping date, and expiry date.";
    return;
  }

  api("POST", "/api/calibration-certificate", {
    equipment_name: name,
    serial_no: sr,
    cert_no: no,
    stamping_date: stamp,
    expiry_date: exp,
    inspector_name: insp,
    notes: notes
  }).then(function(){
    close();
    toast("Stamping certificate saved!");
    loadCalibrationData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not save certificate.";
  });
}

// ============================================================================
// 5. EVAPORATION & STORAGE TANK LOSS / GAIN ANALYTICS
// ============================================================================
var LOSSGAIN_DATA = null;
var LOSSGAIN_LOADING = false;
var LOSSGAIN_TANK = "all";

function loadLossGainData(){
  LOSSGAIN_LOADING = true;
  api("GET", "/api/loss-gain-analytics?tank_id=" + encodeURIComponent(LOSSGAIN_TANK))
    .then(function(res){
      LOSSGAIN_DATA = res;
      LOSSGAIN_LOADING = false;
      if (tab === "lossgain") renderLossGainTab();
    })
    .catch(function(err){
      LOSSGAIN_LOADING = false;
      toast(err.error || "Could not load loss gain analytics.");
      if (tab === "lossgain") renderLossGainTab();
    });
}

function renderLossGainTab(){
  tab = "lossgain";
  var A = document.getElementById("app");
  if (!A) return;

  if (!SRV) {
    A.innerHTML = nav() + '<div class="empty">Tank loss/gain analytics require server connection. Please log in.</div>';
    return;
  }

  if (!LOSSGAIN_DATA && !LOSSGAIN_LOADING) {
    A.innerHTML = nav() + '<div class="empty">Analyzing storage tank loss/gain records…</div>';
    loadLossGainData();
    return;
  }

  var data = LOSSGAIN_DATA || { logs: [], tanks_summary: [], tanks: [], stats: {} };
  var logs = data.logs || [];
  var summaries = data.tanks_summary || [];
  var stats = data.stats || {};

  var h = nav();

  // Top Clubbed Switcher
  h += '<div class="ops-subtabs noprint" style="margin-bottom:14px;background:rgba(0,0,0,0.03);padding:4px;border-radius:10px">';
  h += '<button class="ops-subtab-btn" onclick="window.TANKS_SUBTAB=\'inventory\';renderTanks()">⛽ Live Tank Inventory & Dips</button>';
  h += '<button class="ops-subtab-btn active" onclick="window.TANKS_SUBTAB=\'lossgain\';renderLossGainTab()">📊 Evaporation & Loss / Gain Reconciliation</button>';
  h += '</div>';

  // Header
  h += '<div class="row" style="align-items:center;justify-content:space-between;gap:12px;margin-bottom:8px">';
  h += '<div><h1 style="margin:0">📊 Evaporation & Tank Loss / Gain Analytics</h1><div class="sub" style="margin-top:2px">Book stock vs physical dip reconciliation, OMC evaporation loss benchmarks, and operational variance tracking.</div></div>';
  h += '<div class="btns" style="margin:0;flex:none">';
  if (ME && (ME.role === "owner" || ME.role === "manager")) {
    h += '<button onclick="openReconciliationModal()" style="display:inline-flex;align-items:center;gap:6px">+ Log Daily Reconciliation</button>';
  }
  h += '<button class="ghost" onclick="loadLossGainData()" title="Refresh" style="padding:8px 12px">🔄</button>';
  h += '</div></div>';

  // KPI Metrics
  var netVar = stats.net_operational_variance_litres || 0;
  h += '<div class="ops-kpi-bar noprint">';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num" style="color:' + (netVar < -500 ? 'var(--due)' : 'var(--ink)') + '">' + (netVar > 0 ? '+' : '') + netVar.toLocaleString("en-IN") + ' L</div><div class="ops-kpi-lbl">Cumulative Operational Variance</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num" style="color:var(--ok)">' + (stats.compliance_rate || 100) + '%</div><div class="ops-kpi-lbl">OMC Norm Compliance</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num">' + (stats.total_reconciled_days || logs.length) + '</div><div class="ops-kpi-lbl">Reconciled Day Entries</div></div>';
  h += '<div class="ops-kpi-card"><div class="ops-kpi-num">' + summaries.length + '</div><div class="ops-kpi-lbl">Monitored Fuel Tanks</div></div>';
  h += '</div>';

  // Tank-wise OMC Evaporation Performance Cards
  h += '<div style="margin-bottom:16px">';
  h += '<div style="font-weight:800;font-size:15px;color:var(--ink);margin-bottom:10px">Tank-Wise Cumulative Loss / Gain vs OMC Norms</div>';
  h += '<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px">';
  summaries.forEach(function(ts){
    var isDiesel = String(ts.fuel).toLowerCase().indexOf("diesel") > -1;
    var normPct = isDiesel ? 0.15 : 0.59;
    var varLitres = ts.cumulative_variance_litres || 0;
    var varPct = ts.cumulative_variance_pct || 0;
    var isWithin = Math.abs(varPct) <= normPct;
    var barWidth = Math.min(100, (Math.abs(varPct) / normPct) * 100);

    h += '<div class="ops-tank-card">';
    h += '<div style="display:flex;justify-content:space-between;align-items:flex-start">';
    h += '<div><div style="font-weight:800;font-size:16px;color:var(--ink)">' + esc(ts.tank_name) + '</div><div class="sub" style="font-size:12px">' + esc(ts.fuel) + ' · ' + Number(ts.capacity).toLocaleString("en-IN") + ' L Capacity</div></div>';
    h += '<span class="ops-pill ' + (isWithin ? 'ops-pill-ok' : 'ops-pill-err') + '">' + (isWithin ? 'Within OMC Norm' : 'Excess Loss') + '</span>';
    h += '</div>';

    h += '<div style="margin:12px 0 8px">';
    h += '<div style="display:flex;justify-content:space-between;font-size:13px">';
    h += '<span class="sub">Actual Variance:</span>';
    h += '<b style="color:' + (varLitres < 0 ? 'var(--due)' : 'var(--ok)') + '">' + (varLitres > 0 ? '+' : '') + varLitres.toLocaleString("en-IN") + ' L (' + (varPct > 0 ? '+' : '') + varPct.toFixed(2) + '%)</b>';
    h += '</div>';
    h += '<div style="display:flex;justify-content:space-between;font-size:12px;margin-top:2px">';
    h += '<span class="sub">Permissible OMC Limit:</span>';
    h += '<span style="font-weight:600;color:var(--ink)">±' + normPct + '% of sales (' + (isDiesel ? 'Low volatility HSD' : 'High volatility MS') + ')</span>';
    h += '</div>';
    h += '<div class="ops-bar-bg">';
    h += '<div class="ops-bar-fill" style="width:' + barWidth + '%;background:' + (isWithin ? 'var(--ok)' : 'var(--due)') + '"></div>';
    h += '</div>';
    h += '<div class="sub" style="font-size:11px">' + barWidth.toFixed(0) + '% of maximum allowable handling loss quota used</div>';
    h += '</div>';

    h += '<div style="display:flex;justify-content:space-between;font-size:11.5px;color:var(--mute);border-top:1px dashed var(--line);padding-top:8px">';
    h += '<span>Total Sales: <b>' + Number(ts.total_sales).toLocaleString("en-IN") + ' L</b></span>';
    h += '<span>Inward Receipts: <b>' + Number(ts.total_receipts).toLocaleString("en-IN") + ' L</b></span>';
    h += '</div>';
    h += '</div>';
  });
  h += '</div></div>';

  // Physics & Temperature Analysis
  h += '<div style="background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:16px">';
  h += '<div style="font-weight:700;font-size:14px;color:var(--ink);margin-bottom:4px">💡 Petroleum Physics & OMC Evaporation Allowance Norms</div>';
  h += '<div class="sub" style="font-size:12.5px;line-height:1.5">';
  h += '• <b>Motor Spirit (Petrol / MS):</b> Highly volatile light hydrocarbon with boiling point 35°C–215°C. The Ministry of Petroleum & Natural Gas OMC guidelines allow up to <b>0.59%</b> handling loss (0.75% during summer).<br>';
  h += '• <b>High Speed Diesel (HSD):</b> Heavy hydrocarbon fuel with low vapor pressure; standard allowable loss norm is <b>0.15%</b>.<br>';
  h += '• <b>Temperature Coefficient:</b> A 1°C temperature drop between morning tanker decantation and underground storage can cause up to 0.07% volumetric shrinkage without any mass loss.';
  h += '</div>';
  h += '</div>';

  // Daily Reconciliation Ledger
  h += '<div style="font-weight:800;font-size:15px;color:var(--ink);margin-bottom:10px">Chronological Daily Storage Tank Reconciliation Log</div>';
  if (!logs.length) {
    h += '<div class="empty">No daily reconciliation logs found. Click "+ Log Daily Reconciliation" to record closing tank dips.</div>';
  } else {
    h += '<div class="ops-table-wrap">';
    h += '<table class="ops-table">';
    h += '<thead><tr>';
    h += '<th>Date</th><th>Tank & Fuel</th><th>Opening Dip (L)</th><th>(+) Inward (L)</th><th>(-) Sales (L)</th><th>(=) Book Stock</th><th>Closing Dip (L)</th><th>Variance (L & %)</th><th>Status</th><th>Notes</th>';
    h += '</tr></thead><tbody>';
    logs.forEach(function(row){
      var tObj = data.tanks.find(function(t){ return String(t.id) === String(row.tank_id); }) || { name: "Tank " + row.tank_id };
      var diff = Number(row.variance_qty);
      var diffStr = (diff > 0 ? "+" : "") + diff + " L (" + (row.variance_pct > 0 ? "+" : "") + row.variance_pct + "%)";
      var isPass = row.is_within_norm === 1;

      h += '<tr>';
      h += '<td data-label="Date" style="font-weight:700;white-space:nowrap">' + row.d + '</td>';
      h += '<td data-label="Tank & Fuel"><b>' + esc(tObj.name) + '</b><br><span class="sub" style="font-size:11px">' + esc(row.fuel_type) + '</span></td>';
      h += '<td data-label="Opening Dip">' + Number(row.opening_dip_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="(+) Receipts">' + (row.receipts_qty ? '+' + Number(row.receipts_qty).toLocaleString("en-IN") + ' L' : '0 L') + '</td>';
      h += '<td data-label="(-) Sales" style="color:var(--due)">-' + Number(row.sales_dispensed_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="(=) Book Stock" style="font-weight:700">' + Number(row.book_stock_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="Closing Dip" style="font-weight:800;color:var(--ink)">' + Number(row.physical_dip_qty).toLocaleString("en-IN") + ' L</td>';
      h += '<td data-label="Variance" style="font-weight:700;color:' + (isPass ? 'var(--ok)' : 'var(--due)') + '">' + diffStr + '</td>';
      h += '<td data-label="Status"><span class="ops-pill ' + (isPass ? 'ops-pill-ok' : 'ops-pill-err') + '">' + (isPass ? 'Within Norms' : 'Excess Loss') + '</span></td>';
      h += '<td data-label="Notes" class="sub" style="font-size:11.5px">' + esc(row.notes || 'Routine reconciliation') + '</td>';
      h += '</tr>';
    });
    h += '</tbody></table></div>';
  }

  A.innerHTML = h;
}

function openReconciliationModal(){
  var tanks = (LOSSGAIN_DATA && LOSSGAIN_DATA.tanks) ? LOSSGAIN_DATA.tanks : [];
  var h = '<h2>📊 Log Daily Storage Tank Reconciliation</h2>'
    + '<div class="sub">Reconcile opening physical dip + decantations - nozzle sales against closing physical dip.</div>'
    + '<label style="margin-top:12px">Select Tank'
    + '<select id="rec_tank">'
    + tanks.map(function(t){ return '<option value="' + t.id + '" data-fuel="' + esc(t.fuel) + '">' + esc(t.name) + ' (' + esc(t.fuel) + ')</option>'; }).join("")
    + '</select></label>'
    + '<label>Reconciliation Date<input type="date" id="rec_date" value="' + bizToday() + '"></label>'
    + '<div class="row">'
    + '<label>Opening Physical Dip (L)<input type="number" id="rec_open" placeholder="e.g. 10450" oninput="calcReconcileLive()"></label>'
    + '<label>(+) Inward Tanker Receipts (L)<input type="number" id="rec_receipts" value="0" oninput="calcReconcileLive()"></label>'
    + '</div>'
    + '<div class="row">'
    + '<label>(-) Total Dispenser Sales (L)<input type="number" id="rec_sales" placeholder="e.g. 1680" oninput="calcReconcileLive()"></label>'
    + '<label>Average Fuel Temp (°C)<input type="number" step="0.1" id="rec_temp" value="28.2"></label>'
    + '</div>'
    + '<div class="row">'
    + '<label>Closing Physical Dip (cm)<input type="number" step="0.5" id="rec_cm" placeholder="e.g. 122.0"></label>'
    + '<label>Closing Physical Dip (Litres)<input type="number" id="rec_phys" placeholder="e.g. 8760" oninput="calcReconcileLive()"></label>'
    + '</div>'
    + '<div id="rec_preview_box" style="background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0;font-size:13px">'
    + '<div>Calculated Book Stock: <b id="rec_book_val">—</b></div>'
    + '<div>Operational Variance: <b id="rec_var_val">—</b></div>'
    + '<div id="rec_status_val" style="font-weight:700;margin-top:4px;color:var(--mute)">Enter opening, sales, and closing dip to calculate</div>'
    + '</div>'
    + '<label>Reconciliation Notes<input id="rec_notes" placeholder="e.g. Closing shift dip taken at 22:00 PM, ATG reading matched."></label>'
    + '<div class="err" id="rec_err"></div>'
    + '<div class="btns" style="margin-top:14px;display:flex;gap:8px">'
    + '<button class="ghost" onclick="close()">Cancel</button>'
    + '<button style="flex:1" onclick="submitReconciliation()">Save Tank Reconciliation</button>'
    + '</div>';

  openM(h);
}

function calcReconcileLive(){
  var openL = parseFloat((document.getElementById("rec_open")||{}).value) || 0;
  var recL = parseFloat((document.getElementById("rec_receipts")||{}).value) || 0;
  var saleL = parseFloat((document.getElementById("rec_sales")||{}).value) || 0;
  var physL = parseFloat((document.getElementById("rec_phys")||{}).value);

  var tankEl = document.getElementById("rec_tank");
  var opt = tankEl ? tankEl.options[tankEl.selectedIndex] : null;
  var fuel = opt ? opt.getAttribute("data-fuel") : "Diesel (HSD)";
  var isDiesel = fuel.indexOf("Diesel") > -1 || fuel.indexOf("HSD") > -1;
  var norm = isDiesel ? 0.15 : 0.59;

  var bookStock = Math.round((openL + recL - saleL) * 10) / 10;
  var bookEl = document.getElementById("rec_book_val");
  var varEl = document.getElementById("rec_var_val");
  var statEl = document.getElementById("rec_status_val");

  if (bookEl) bookEl.textContent = bookStock.toLocaleString("en-IN") + " L";

  if (!isNaN(physL)) {
    var diffL = Math.round((physL - bookStock) * 10) / 10;
    var pct = bookStock > 0 ? Math.round((diffL / bookStock) * 10000) / 100 : 0;
    var isWithin = Math.abs(pct) <= norm;

    if (varEl) {
      varEl.textContent = (diffL > 0 ? "+" : "") + diffL + " L (" + (pct > 0 ? "+" : "") + pct + "%)";
      varEl.style.color = isWithin ? "var(--ok)" : "var(--due)";
    }
    if (statEl) {
      statEl.innerHTML = isWithin
        ? '<span style="color:var(--ok)">✅ Strictly within OMC Evaporation Norm (Limit ±' + norm + '%)</span>'
        : '<span style="color:var(--due)">⚠️ EXCEEDS OMC EVAPORATION ALLOWANCE (Diff: ' + pct + '%)</span>';
    }
  }
}

function submitReconciliation(){
  var tankId = v("rec_tank");
  var d = v("rec_date");
  var openL = v("rec_open");
  var recL = v("rec_receipts");
  var saleL = v("rec_sales");
  var cm = v("rec_cm");
  var physL = v("rec_phys");
  var temp = v("rec_temp");
  var notes = v("rec_notes");
  var errEl = document.getElementById("rec_err");

  if (!tankId || !physL) {
    if (errEl) errEl.textContent = "Please select tank and enter physical dip litres.";
    return;
  }

  api("POST", "/api/loss-gain-reconcile", {
    d: d,
    tank_id: tankId,
    opening_dip_qty: openL ? parseFloat(openL) : 0,
    receipts_qty: recL ? parseFloat(recL) : 0,
    sales_dispensed_qty: saleL ? parseFloat(saleL) : 0,
    closing_dip_cm: cm ? parseFloat(cm) : null,
    physical_dip_qty: parseFloat(physL),
    temp_avg: temp ? parseFloat(temp) : null,
    notes: notes
  }).then(function(){
    close();
    toast("Daily tank reconciliation saved!");
    loadLossGainData();
  }).catch(function(e){
    if (errEl) errEl.textContent = e.error || "Could not save reconciliation.";
  });
}

<script>
function applyResponsiveTableLabels(rootEl) {
  var root = rootEl || document;
  var tables = root.querySelectorAll(".ops-table, .tbl table, table");
  tables.forEach(function(tbl){
    var headerRow = tbl.querySelector("thead tr") || tbl.querySelector("tr:has(th)") || tbl.querySelector("tr");
    if (!headerRow) return;
    var thEls = headerRow.querySelectorAll("th");
    if (!thEls.length) return;
    headerRow.classList.add("ops-mobile-header-row");
    var ths = Array.from(thEls).map(function(th){
      return th.textContent.trim().replace(/\s+/g, " ");
    });

    var rows = tbl.querySelectorAll("tbody tr, tr");
    rows.forEach(function(tr){
      if (tr === headerRow || tr.classList.contains("ops-mobile-header-row") || tr.querySelector("th")) {
        tr.classList.add("ops-mobile-header-row");
        return;
      }
      var tds = tr.querySelectorAll("td");
      if (tds.length === 1 && (tds[0].colSpan > 1 || tds[0].classList.contains("empty"))) {
        tds[0].classList.add("ops-mobile-fullwidth-cell");
        return;
      }
      tds.forEach(function(td, idx){
        if (!td.getAttribute("data-label") && ths[idx]) {
          td.setAttribute("data-label", ths[idx]);
        }
      });
    });
  });
}

if (window.MutationObserver) {
  var opsTableObserver = new MutationObserver(function(){
    var app = document.getElementById("app");
    if (app) applyResponsiveTableLabels(app);
  });
  window.addEventListener("DOMContentLoaded", function(){
    var app = document.getElementById("app");
    if (app) opsTableObserver.observe(app, { childList: true, subtree: true });
    applyResponsiveTableLabels(document);
  });
}

boot();
</script>
